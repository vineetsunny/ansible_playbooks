# =============================================================================
# Playbook Name : c-cdrive-housekeeping.yaml
#
# Description   : C: drive housekeeping on Windows VMs, including
#                 temporary file cleanup, historical log removal, IIS log
#                 cleanup, memory dump removal, SCCM cache cleanup, and
#                 shadow copy management.
#
# Purpose       : Reclaim C: drive disk space by removing files and cached
#                 data older than configured retention periods and limiting
#                 shadow copy storage consumption.
#
# Scope         : Windows servers / VMs
# Target FS     : C:
# Trigger       : Remediation runs only when C: drive free space is below 20%.
#                 If free space is >= 20%, no action is required.
#
# Retention     : 7 days  - C:\Temp, C:\Windows\Temp, memory dumps,
#                           SCCM cache and shadow copies.
#                 15 days - Troubleshooting logs, security event logs,
#                           ConfigurationStatus, Windows PatchCache,
#                           and Recycle Bin.
#                 30 days - IIS log files.
#
# Log Path      : C:\Windows\Build\logs\C_Housekeeping_ARF\
# Log File      : C:\Windows\Build\logs\C_Housekeeping_ARF\C_Housekeeping_ARF.log
#
#
# Execution     : ansible-playbook -i inventory c-cdrive-housekeeping.yaml
#
# Important     : If C: drive free space is >= 20%, cleanup is skipped.
#                 Cleanup is based on file LastWriteTime for configured
#                 directories and logs.
#                 SCCM cache entries are removed based on LastReferenceTime.
#                 Shadow copies older than 7 days are deleted.
#                 Unbounded shadow storage is resized to a maximum of 10%.
#                 Cleanup actions run whenever the Ansible playbook executes.
#                 Deleted files and shadow copies cannot be recovered through
#                 this playbook.
#
# Exit Codes    : 0  - No remediation required (free space >= 20%).
#                 1  - Cleanup successful (free space >= 20% after cleanup).
#                 2  - Partial cleanup (free space still below 20%).
#                 3  - No cleanup performed.
#                 20 - Execution failed.
#
# Output        : Pre-cleanup and post-cleanup disk metrics, recovered space,
#                 action count, execution status, and exit code.
#
# Version       : 1.0
# =============================================================================

# =============================================================================
# Playbook Name : c-cdrive-housekeeping.yaml
#
# Description   : C: drive housekeeping with per-directory audit tracking.
# =============================================================================
---
- name: Windows Drive C Disk Housekeeping & Remediation
  hosts: test-vm
  gather_facts: false
  tasks:
    - name: Run C Drive Housekeeping Script
      ansible.windows.win_shell: |
        {% raw %}
        $ErrorActionPreference = 'SilentlyContinue'

        $LogFolder = 'C:\Windows\Build\logs\C_Housekeeping_ARF'
        $LogFile = Join-Path -Path $LogFolder -ChildPath 'C_Housekeeping_ARF.log'

        if (!(Test-Path -Path $LogFolder)) {
            New-Item -ItemType Directory -Path $LogFolder -Force | Out-Null
        }
        if (!(Test-Path -Path $LogFile)) {
            New-Item -ItemType File -Path $LogFile -Force | Out-Null
        }

        "`r`n`r`n============================== [ RUN: $(Get-Date) ] ==============================" | Out-File -FilePath $LogFile -Append

        function Get-CDiskInfo {
            $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='C:'"
            $freePct = [math]::Round(($disk.FreeSpace / $disk.Size) * 100, 2)
            $freeGB  = [math]::Round($disk.FreeSpace / 1GB, 2)
            $totalGB = [math]::Round($disk.Size / 1GB, 2)
            return [PSCustomObject]@{
                FreePercent = $freePct
                FreeGB      = $freeGB
                TotalGB     = $totalGB
            }
        }

        $initDisk = Get-CDiskInfo
        $initialFreePct = $initDisk.FreePercent

        # 1. Seed missing target for testing if not available
        $secEvtPath = 'C:\SYS\evtlog\sec'
        if (!(Test-Path -Path $secEvtPath)) {
            New-Item -ItemType Directory -Path $secEvtPath -Force | Out-Null
        }
        $existingSecFiles = Get-ChildItem -Path $secEvtPath -File -ErrorAction SilentlyContinue
        if (!$existingSecFiles) {
            $sampleSecFile = Join-Path -Path $secEvtPath -ChildPath 'archive_sec_event.evtx'
            New-Item -ItemType File -Path $sampleSecFile -Force | Out-Null
            (Get-Item $sampleSecFile).LastWriteTime = (Get-Date).AddDays(-20)
            "Created missing folder and seed file older than 15 days at: $sampleSecFile" | Out-File -FilePath $LogFile -Append
        }

        # 2. Seed ConfigurationStatus file (Protected - No Delete)
        $configStatusPath = 'C:\Windows\System32\Configuration\ConfigurationStatus'
        if (!(Test-Path -Path $configStatusPath)) {
            New-Item -ItemType Directory -Path $configStatusPath -Force | Out-Null
        }
        $sampleConfigFile = Join-Path -Path $configStatusPath -ChildPath 'status_record_archive.mof'
        if (!(Test-Path -Path $sampleConfigFile)) {
            New-Item -ItemType File -Path $sampleConfigFile -Force | Out-Null
            (Get-Item $sampleConfigFile).LastWriteTime = (Get-Date).AddDays(-25)
            "Created old file (>15 days, retained) at: $sampleConfigFile" | Out-File -FilePath $LogFile -Append
        }

        # Global counters & audit table
        $actionsCount = 0
        $directoryReports = [System.Collections.Generic.List[PSCustomObject]]::new()

        # Check threshold (Skip cleanup if free space >= 20%)
        if ($initialFreePct -ge 20) {
            "Free space >= 20% ($initialFreePct%). No remediation required." | Out-File -FilePath $LogFile -Append
            $resultObj = [PSCustomObject]@{
                Status           = 'OUT_OF_SCOPE'
                ExitCode         = 0
                InitialFreePct   = $initialFreePct
                FinalFreePct     = $initialFreePct
                InitialFreeGB    = $initDisk.FreeGB
                FinalFreeGB      = $initDisk.FreeGB
                TotalSizeGB      = $initDisk.TotalGB
                ActionsCount     = 0
                DirectorySummary = @()
                Message          = 'Free space is above 20%. No action needed.'
            }
            Write-Output ($resultObj | ConvertTo-Json -Depth 4 -Compress)
            exit 0
        }

        # Targeted directory age cleanup with per-directory audit
        function Clean-DirectoryAge {
            param (
                [string[]]$Paths,
                [int]$Days,
                [string]$Filter = "*"
            )
            $cutoff = (Get-Date).AddDays(-$Days)

            foreach ($p in $Paths) {
                $dirDeleted = 0
                $dirFailed  = 0
                $dirFound   = 0

                if (Test-Path -Path $p) {
                    $items = Get-ChildItem -Path $p -Filter $Filter -Recurse -Force -ErrorAction SilentlyContinue | 
                             Where-Object { -not $_.PSIsContainer -and $_.LastWriteTime -lt $cutoff }
                    
                    if ($items) {
                        $dirFound = @($items).Count
                        foreach ($item in $items) {
                            try {
                                Remove-Item -LiteralPath $item.FullName -Force -ErrorAction Stop
                                "[DELETED] $($item.FullName)" | Out-File -FilePath $LogFile -Append
                                $dirDeleted++
                                $script:actionsCount++
                            } catch {
                                "[LOCKED/FAILED] $($item.FullName) - Reason: $($_.Exception.Message)" | Out-File -FilePath $LogFile -Append
                                $dirFailed++
                            }
                        }
                    }

                    if ($dirFound -eq 0) {
                        $status = "NO_FILES_MATCHED"
                    } elseif ($dirFailed -eq 0) {
                        $status = "SUCCESS"
                    } else {
                        $status = "PARTIAL_FAILURE"
                    }
                } else {
                    $status = "NOT_FOUND"
                    "[SKIPPED] Path does not exist: $p" | Out-File -FilePath $LogFile -Append
                }

                $dirReport = [PSCustomObject]@{
                    Path    = $p
                    Days    = $Days
                    Status  = $status
                    Found   = $dirFound
                    Deleted = $dirDeleted
                    Failed  = $dirFailed
                }
                $script:directoryReports.Add($dirReport)
                "DIR_SUMMARY: [$status] $p (Found: $dirFound, Deleted: $dirDeleted, Failed: $dirFailed)" | Out-File -FilePath $LogFile -Append
            }
        }

        try {
            # 1. 7-Day Cleanup Paths
            $targets_7d = @(
                'C:\Temp',
                'C:\Windows\Temp',
                'C:\Windows\SoftwareDistribution\Download'
            )
            Clean-DirectoryAge -Paths $targets_7d -Days 7

            # 2. 15-Day Cleanup Paths
            $targets_15d = @(
                'C:\SYS\PERFLOG\Troubleshoot_CTR',
                'C:\SYS\evtlog\sec',
                'C:\Windows\Installer\$PatchCache$\Managed',
                'C:\$Recycle.Bin',
                'C:\ProgramData\Microsoft\Windows\WER\ReportArchive',
                'C:\ProgramData\Microsoft\Windows\WER\ReportQueue'
            )
            Clean-DirectoryAge -Paths $targets_15d -Days 15

            # 3. CBS Persistent Logs (>15 days)
            Clean-DirectoryAge -Paths @('C:\Windows\Logs\CBS') -Days 15 -Filter 'CbsPersist_*.log'

            # 4. IIS Logs (>30 days)
            $iisLogCandidates = @(
                'C:\inetpub\logs\LogFiles',
                'C:\Windows\System32\LogFiles\HTTPERR',
                'C:\Windows\System32\LogFiles\W3SVC1'
            )
            Clean-DirectoryAge -Paths $iisLogCandidates -Days 30 -Filter '*.log'

            # 5. Windows Memory Dumps (>7 days)
            Clean-DirectoryAge -Paths @('C:\Windows') -Days 7 -Filter 'mem*.dmp*'
            Clean-DirectoryAge -Paths @('C:\Windows\Minidump') -Days 7 -Filter '*.dmp'

            # 6. SCCM / CCMCache cleanup (>7 days)
            try {
                $uiResMgr = New-Object -ComObject 'UIResource.UIResourceMgr'
                $cacheInfo = $uiResMgr.GetCacheInfo()
                $ccmCutoff = (Get-Date).AddDays(-7)
                $oldCcmElements = $cacheInfo.GetCacheElements() | 
                                  Where-Object { [datetime]$_.LastReferenceTime -lt $ccmCutoff }
                if ($oldCcmElements) {
                    foreach ($elem in $oldCcmElements) {
                        try {
                            $cacheInfo.DeleteCacheElement($elem.CacheElementID)
                            "[DELETED] CCMCache ID: $($elem.CacheElementID)" | Out-File -FilePath $LogFile -Append
                            $actionsCount++
                        } catch {
                            "[FAILED] CCMCache ID: $($elem.CacheElementID) - Reason: $($_.Exception.Message)" | Out-File -FilePath $LogFile -Append
                        }
                    }
                }
            } catch {
                "[SKIPPED] SCCM COM Object not found or unavailable." | Out-File -FilePath $LogFile -Append
            }

            # 7. Shadow Copies (>7 days) and Storage Limit Resize
            try {
                $cVol = Get-CimInstance -ClassName Win32_Volume -Filter "DriveLetter='C:'"
                if ($cVol) {
                    $shadows = Get-CimInstance -ClassName Win32_ShadowCopy | 
                               Where-Object { $_.VolumeName -eq $cVol.DeviceID }
                    $vssCutoff = (Get-Date).AddDays(-7)
                    foreach ($s in $shadows) {
                        $sDate = [System.Management.ManagementDateTimeConverter]::ToDateTime($s.InstallDate)
                        if ($sDate -lt $vssCutoff) {
                            $s | Remove-CimInstance -ErrorAction SilentlyContinue
                            "[DELETED] Shadow Copy ID: $($s.ID)" | Out-File -FilePath $LogFile -Append
                            $actionsCount++
                        }
                    }
                }

                $storage = Get-CimInstance -ClassName Win32_ShadowStorage | 
                           Where-Object { $_.Volume -match [regex]::Escape($cVol.DeviceID) }
                if ($storage.MaxSpace -eq 18446744073709551615 -or $storage.MaxSpace -eq 9223372036854775807) {
                    vssadmin resize shadowstorage /for=C: /on=C: /maxsize=10% | Out-Null
                    '[RESIZED] Shadow copy storage resized to 10%' | Out-File -FilePath $LogFile -Append
                    $actionsCount++
                }
            } catch {
                $null = $_
            }

        } catch {
            $errObj = [PSCustomObject]@{
                Status           = 'EXECUTION_FAILED'
                ExitCode         = 20
                InitialFreePct   = $initialFreePct
                FinalFreePct     = (Get-CDiskInfo).FreePercent
                ActionsCount     = $actionsCount
                DirectorySummary = $directoryReports
                Message          = $_.Exception.Message
            }
            Write-Output ($errObj | ConvertTo-Json -Depth 4 -Compress)
            exit 20
        }

        # Evaluate final post-cleanup metrics
        $finalDisk = Get-CDiskInfo
        $finalFreePct = $finalDisk.FreePercent

        if ($actionsCount -gt 0 -and $finalFreePct -ge 20) {
            $exitCode = 1
            $status = 'SUCCESSFUL_CLEANUP'
        } elseif ($actionsCount -gt 0 -and $finalFreePct -lt 20) {
            $exitCode = 2
            $status = 'PARTIAL_CLEANUP'
        } else {
            $exitCode = 3
            $status = 'NO_CLEANUP_PERFORMED'
        }

        $resultObj = [PSCustomObject]@{
            Status           = $status
            ExitCode         = $exitCode
            InitialFreePct   = $initialFreePct
            FinalFreePct     = $finalFreePct
            InitialFreeGB    = $initDisk.FreeGB
            FinalFreeGB      = $finalDisk.FreeGB
            TotalSizeGB      = $finalDisk.TotalGB
            ActionsCount     = $actionsCount
            DirectorySummary = $directoryReports
            Message          = 'Remediation executed.'
        }

        Write-Output ($resultObj | ConvertTo-Json -Depth 4 -Compress)
        exit $exitCode
        {% endraw %}
      register: housekeeping_raw
      failed_when: housekeeping_raw.rc == 20
      changed_when: housekeeping_raw.rc in [1, 2]

    - name: Parse Remediation Output
      ansible.builtin.set_fact:
        cleanup_metrics: "{{ housekeeping_raw.stdout_lines[-1] | from_json }}"

    - name: Display Housekeeping Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "               DRIVE C: HOUSEKEEPING SUMMARY             "
          - "=========================================================="
          - " Host             : {{ inventory_hostname }}"
          - " Total Drive Size : {{ cleanup_metrics.TotalSizeGB }} GB"
          - " Pre-cleanup Free : {{ cleanup_metrics.InitialFreeGB }} GB ({{ cleanup_metrics.InitialFreePct }}%)"
          - " Post-cleanup Free: {{ cleanup_metrics.FinalFreeGB }} GB ({{ cleanup_metrics.FinalFreePct }}%)"
          - " Space Recovered  : {{ (cleanup_metrics.FinalFreeGB - cleanup_metrics.InitialFreeGB) | round(2) }} GB"
          - " Action Items Hit : {{ cleanup_metrics.ActionsCount }}"
          - " Message          : {{ cleanup_metrics.Message }}"
          - " Log Location     : C:\\Windows\\Build\\logs\\C_Housekeeping_ARF\\C_Housekeeping_ARF.log"
          - " Execution Status : {{ cleanup_metrics.Status }} (Exit Code: {{ cleanup_metrics.ExitCode }})"
          - "=========================================================="

    - name: Display Per-Directory Cleanup Audit
      ansible.builtin.debug:
        msg: >-
          [{{ item.Status | default('N/A') }}]
          Path: {{ item.Path }} |
          Age: >{{ item.Days }}d |
          Found: {{ item.Found }} |
          Deleted: {{ item.Deleted }} |
          Failed: {{ item.Failed }}
      loop: "{{ cleanup_metrics.DirectorySummary | default([]) }}"
      loop_control:
        label: "{{ item.Path }}"
