---
- name: Windows Drive C Disk Housekeeping & Remediation
  hosts: windows
  gather_facts: false
  tasks:
    - name: Run C Drive Housekeeping Script
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'

        $LogFolder = "C:\Windows\Build\logs\C_Housekeeping_ARF"
        $LogFile = "$LogFolder\C_Housekeeping_ARF.log"

        if (!(Test-Path -Path $LogFolder)) {
            New-Item -ItemType Directory -Path $LogFolder -Force | Out-Null
        }
        if (!(Test-Path -Path $LogFile)) {
            New-Item -ItemType File -Path $LogFile -Force | Out-Null
        } else {
            Clear-Content -Path $LogFile -Force
        }
        Get-Date | Out-File -FilePath $LogFile -Append

        # Helper to retrieve C: disk metrics
        function Get-CDiskInfo {
            $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='C:'"
            $freePct = [math]::Round(($disk.FreeSpace / $disk.Size) * 100, 2)
            $freeGB  = [math]::Round($disk.FreeSpace / 1GB, 2)
            $totalGB = [math]::Round($disk.Size / 1GB, 2)
            return [PSCustomObject]@{
                FreePercent = $freePct
                FreeGB      = $freeGB
                TotalGB     = $totalGB
            }
        }

        $initDisk = Get-CDiskInfo
        $initialFreePct = $initDisk.FreePercent

        # Check threshold (Skip cleanup if free space >= 20%)
        if ($initialFreePct -ge 20) {
            "Free space >= 20% ($initialFreePct%). No remediation required." | Out-File -FilePath $LogFile -Append
            $resultObj = [PSCustomObject]@{
                Status          = "OUT_OF_SCOPE"
                ExitCode        = 0
                InitialFreePct  = $initialFreePct
                FinalFreePct    = $initialFreePct
                InitialFreeGB   = $initDisk.FreeGB
                FinalFreeGB     = $initDisk.FreeGB
                TotalSizeGB     = $initDisk.TotalGB
                ActionsCount    = 0
                Message         = "Free space is above 20%. No action needed."
            }
            Write-Output ($resultObj | ConvertTo-Json -Compress)
            exit 0
        }

        $actionsCount = 0

        # Helper function for targeted directory age cleanup
        function Clean-DirectoryAge {
            param (
                [string[]]$Paths,
                [int]$Days
            )
            $cutoff = (Get-Date).AddDays(-$Days)
            foreach ($p in $Paths) {
                if (Test-Path -Path $p) {
                    $items = Get-ChildItem -Path $p -Recurse -Force -ErrorAction SilentlyContinue | 
                             Where-Object { -not $_.PSIsContainer -and $_.LastWriteTime -lt $cutoff }
                    if ($items) {
                        $items | ForEach-Object { $_.FullName } | Out-File -FilePath $LogFile -Append
                        $items | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
                        $script:actionsCount++
                    }
                }
            }
        }

        try {
            # 1. 7-Day Cleanup Paths
            $targets_7d = @("C:\Temp\", "C:\Windows\Temp\")
            Clean-DirectoryAge -Paths $targets_7d -Days 7

            # 2. 15-Day Cleanup Paths
            $targets_15d = @(
                "C:\SYS\PERFLOG\Troubleshoot_CTR\",
                "C:\SYS\evtlog\sec\",
                "C:\Windows\System32\Configuration\ConfigurationStatus\",
                "C:\Windows\Installer\`$PatchCache`$\Managed\",
                "C:\`$Recycle.Bin\"
            )
            Clean-DirectoryAge -Paths $targets_15d -Days 15

            # 3. IIS Log Cleanup (>30 days)
            $iis = Get-CimInstance -ClassName Win32_Service -Filter "Name='W3SVC'"
            if ($iis) {
                Import-Module WebAdministration -ErrorAction SilentlyContinue
                if (Get-Command get-website -ErrorAction SilentlyContinue) {
                    foreach ($site in $(Get-Website)) {
                        $rawDir = [System.Environment]::ExpandEnvironmentVariables($site.logFile.directory)
                        if ($rawDir -match '^[Cc]:') {
                            $siteLogPath = Join-Path -Path $rawDir -ChildPath "W3SVC$($site.id)"
                            if (Test-Path $siteLogPath) {
                                $iisCutoff = (Get-Date).AddDays(-30)
                                $oldLogs = Get-ChildItem -Path $siteLogPath -Filter "*.log" -Force -ErrorAction SilentlyContinue | 
                                           Where-Object { $_.LastWriteTime -lt $iisCutoff }
                                if ($oldLogs) {
                                    $oldLogs | ForEach-Object { $_.FullName } | Out-File -FilePath $LogFile -Append
                                    $oldLogs | Remove-Item -Force -ErrorAction SilentlyContinue
                                    $actionsCount++
                                }
                            }
                        }
                    }
                }
            }

            # 4. Windows Memory Dumps (>7 days)
            $memCutoff = (Get-Date).AddDays(-7)
            $dumps = Get-ChildItem -Path "C:\Windows\" -Filter "mem*.dmp*" -Force -ErrorAction SilentlyContinue | 
                     Where-Object { $_.LastWriteTime -lt $memCutoff }
            if ($dumps) {
                $dumps | ForEach-Object { $_.FullName } | Out-File -FilePath $LogFile -Append
                $dumps | Remove-Item -Force -ErrorAction SilentlyContinue
                $actionsCount++
            }

            # 5. SCCM / CCMCache cleanup (>7 days)
            try {
                $uiResMgr = New-Object -ComObject "UIResource.UIResourceMgr"
                $cacheInfo = $uiResMgr.GetCacheInfo()
                $ccmCutoff = (Get-Date).AddDays(-7)
                $oldCcmElements = $cacheInfo.GetCacheElements() | 
                                  Where-Object { [datetime]$_.LastReferenceTime -lt $ccmCutoff }
                if ($oldCcmElements) {
                    foreach ($elem in $oldCcmElements) {
                        "CCMCache ID: $($elem.CacheElementID)" | Out-File -FilePath $LogFile -Append
                        $cacheInfo.DeleteCacheElement($elem.CacheElementID)
                    }
                    $actionsCount++
                }
            } catch {}

            # 6. Shadow Copies (>7 days) and Storage Limit Resize
            try {
                $cVol = Get-CimInstance -ClassName Win32_Volume -Filter "DriveLetter='C:'"
                if ($cVol) {
                    $shadows = Get-CimInstance -ClassName Win32_ShadowCopy | 
                               Where-Object { $_.VolumeName -eq $cVol.DeviceID }
                    $vssCutoff = (Get-Date).AddDays(-7)
                    foreach ($s in $shadows) {
                        $sDate = [System.Management.ManagementDateTimeConverter]::ToDateTime($s.InstallDate)
                        if ($sDate -lt $vssCutoff) {
                            $s | Remove-CimInstance -ErrorAction SilentlyContinue
                            $actionsCount++
                        }
                    }
                }

                # Resize ShadowStorage if set to unbounded / max limits
                $storage = Get-CimInstance -ClassName Win32_ShadowStorage | 
                           Where-Object { $_.Volume -match [regex]::Escape($cVol.DeviceID) }
                if ($storage.MaxSpace -eq 18446744073709551615 -or $storage.MaxSpace -eq 9223372036854775807) {
                    vssadmin resize shadowstorage /for=C: /on=C: /maxsize=10% | Out-Null
                    "Shadow copy size resized to 10%" | Out-File -FilePath $LogFile -Append
                    $actionsCount++
                }
            } catch {}

        } catch {
            $errObj = [PSCustomObject]@{
                Status          = "EXECUTION_FAILED"
                ExitCode        = 20
                InitialFreePct  = $initialFreePct
                FinalFreePct    = (Get-CDiskInfo).FreePercent
                ActionsCount    = $actionsCount
                Message         = $_.Exception.Message
            }
            Write-Output ($errObj | ConvertTo-Json -Compress)
            exit 20
        }

        # Evaluate final post-cleanup metrics
        $finalDisk = Get-CDiskInfo
        $finalFreePct = $finalDisk.FreePercent

        if ($actionsCount -gt 0 -and $finalFreePct -ge 20) {
            $exitCode = 1
            $status = "SUCCESSFUL_CLEANUP"
        } elseif ($actionsCount -gt 0 -and $finalFreePct -lt 20) {
            $exitCode = 2
            $status = "PARTIAL_CLEANUP"
        } else {
            $exitCode = 3
            $status = "NO_CLEANUP_PERFORMED"
        }

        $resultObj = [PSCustomObject]@{
            Status          = $status
            ExitCode        = $exitCode
            InitialFreePct  = $initialFreePct
            FinalFreePct    = $finalFreePct
            InitialFreeGB   = $initDisk.FreeGB
            FinalFreeGB     = $finalDisk.FreeGB
            TotalSizeGB     = $finalDisk.TotalGB
            ActionsCount    = $actionsCount
            Message         = "Remediation executed."
        }

        Write-Output ($resultObj | ConvertTo-Json -Compress)
        exit $exitCode
      register: housekeeping_raw
      failed_when: housekeeping_raw.rc == 20
      changed_when: housekeeping_raw.rc in [1, 2]

    - name: Parse Remediation Output
      ansible.builtin.set_fact:
        cleanup_metrics: "{{ housekeeping_raw.stdout_lines[-1] | from_json }}"

    - name: Display Housekeeping Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "               DRIVE C: HOUSEKEEPING SUMMARY             "
          - "=========================================================="
          - " Host             : {{ inventory_hostname }}"
          - " Execution Status : {{ cleanup_metrics.Status }} (Exit Code: {{ cleanup_metrics.ExitCode }})"
          - " Total Drive Size : {{ cleanup_metrics.TotalSizeGB }} GB"
          - " Pre-cleanup Free : {{ cleanup_metrics.InitialFreeGB }} GB ({{ cleanup_metrics.InitialFreePct }}%)"
          - " Post-cleanup Free: {{ cleanup_metrics.FinalFreeGB }} GB ({{ cleanup_metrics.FinalFreePct }}%)"
          - " Space Recovered  : {{ (cleanup_metrics.FinalFreeGB - cleanup_metrics.InitialFreeGB) | round(2) }} GB"
          - " Action Items Hit : {{ cleanup_metrics.ActionsCount }}"
          - " Message          : {{ cleanup_metrics.Message }}"
          - " Log Location     : C:\\Windows\\Build\\logs\\C_Housekeeping_ARF\\C_Housekeeping_ARF.log"
          - "=========================================================="
