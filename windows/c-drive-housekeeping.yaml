# =============================================================================
# Playbook Name : c-cdrive-housekeeping.yaml
#
# Description   : C: drive housekeeping on Windows VMs, including
#                 temporary file cleanup, historical log removal, IIS log
#                 cleanup, memory dump removal, SCCM cache cleanup, and
#                 shadow copy management.
#
# Purpose       : Reclaim C: drive disk space by removing files and cached
#                 data older than configured retention periods and limiting
#                 shadow copy storage consumption.
#
# Scope         : Windows servers / VMs
# Target FS     : C:
# Trigger       : Remediation runs only when C: drive free space is below 20%.
#                 If free space is >= 20%, no action is required.
#
# Retention     : 7 days  - C:\Temp, C:\Windows\Temp, memory dumps,
#                           SCCM cache and shadow copies.
#                 15 days - Troubleshooting logs, security event logs,
#                           ConfigurationStatus, Windows PatchCache,
#                           and Recycle Bin.
#                 30 days - IIS log files.
#
# Log Path      : C:\Windows\Build\logs\C_Housekeeping_ARF\
# Log File      : C:\Windows\Build\logs\C_Housekeeping_ARF\C_Housekeeping_ARF.log
#
#
# Execution     : ansible-playbook -i inventory c-cdrive-housekeeping.yaml
#
# Important     : If C: drive free space is >= 20%, cleanup is skipped.
#                 Cleanup is based on file LastWriteTime for configured
#                 directories and logs.
#                 SCCM cache entries are removed based on LastReferenceTime.
#                 Shadow copies older than 7 days are deleted.
#                 Unbounded shadow storage is resized to a maximum of 10%.
#                 Cleanup actions run whenever the Ansible playbook executes.
#                 Deleted files and shadow copies cannot be recovered through
#                 this playbook.
#
# Exit Codes    : 0  - No remediation required (free space >= 20%).
#                 1  - Cleanup successful (free space >= 20% after cleanup).
#                 2  - Partial cleanup (free space still below 20%).
#                 3  - No cleanup performed.
#                 20 - Execution failed.
#
# Output        : Pre-cleanup and post-cleanup disk metrics, recovered space,
#                 action count, execution status, and exit code.
#
# Version       : 1.0
# =============================================================================
---
- name: Windows Drive C Disk Housekeeping & Remediation
  hosts: test-vm
  gather_facts: false
  tasks:
    - name: Run C Drive Housekeeping Script
      ansible.windows.win_shell: |
        {% raw %}
        $ErrorActionPreference = 'Stop'

        $LogFolder = 'C:\Windows\Build\logs\C_Housekeeping_ARF'
        $LogFile   = Join-Path -Path $LogFolder -ChildPath 'C_Housekeeping_ARF.log'

        if (!(Test-Path -Path $LogFolder)) {
            New-Item -ItemType Directory -Path $LogFolder -Force | Out-Null
        }
        if (!(Test-Path -Path $LogFile)) {
            New-Item -ItemType File -Path $LogFile -Force | Out-Null
        }

        "`r`n`r`n============================== [ RUN: $(Get-Date) ] ==============================" | Out-File -FilePath $LogFile -Append

        function Get-CDiskInfo {
            $disk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='C:'"
            $freePct = [math]::Round(($disk.FreeSpace / $disk.Size) * 100, 2)
            $freeGB  = [math]::Round($disk.FreeSpace / 1GB, 2)
            $totalGB = [math]::Round($disk.Size / 1GB, 2)
            return [PSCustomObject]@{
                FreePercent = $freePct
                FreeGB      = $freeGB
                TotalGB     = $totalGB
            }
        }

        $initDisk = Get-CDiskInfo
        $initialFreePct = $initDisk.FreePercent
        $actionsCount = 0
        $directoryReports = [System.Collections.Generic.List[PSCustomObject]]::new()

        # Exit early if remediation is not required
        if ($initialFreePct -ge 20) {
            "Free space >= 20% ($initialFreePct%). No remediation required." | Out-File -FilePath $LogFile -Append
            $resultObj = [PSCustomObject]@{
                Status           = 'OUT_OF_SCOPE'
                ExitCode         = 0
                InitialFreePct   = $initialFreePct
                FinalFreePct     = $initialFreePct
                InitialFreeGB    = $initDisk.FreeGB
                FinalFreeGB      = $initDisk.FreeGB
                TotalSizeGB      = $initDisk.TotalGB
                ActionsCount     = 0
                DirectorySummary = @()
                Message          = 'Free space is above 20%. No action needed.'
            }
            Write-Output ($resultObj | ConvertTo-Json -Depth 4 -Compress)
            exit 0
        }

        # Targeted directory cleanup helper
        function Clean-DirectoryAge {
            param (
                [string]$Path,
                [int]$Days,
                [string]$Filter = "*",
                [switch]$Recurse
            )
            $cutoff = (Get-Date).AddDays(-$Days)
            $dirDeleted = 0
            $dirFailed  = 0
            $dirFound   = 0

            if (Test-Path -Path $Path) {
                $gciParams = @{
                    Path        = $Path
                    Filter      = $Filter
                    Force       = $true
                    ErrorAction = 'SilentlyContinue'
                }
                if ($Recurse) { $gciParams['Recurse'] = $true }

                $items = Get-ChildItem @gciParams | 
                         Where-Object { -not $_.PSIsContainer -and $_.LastWriteTime -lt $cutoff }
                
                if ($items) {
                    $dirFound = @($items).Count
                    foreach ($item in $items) {
                        try {
                            Remove-Item -LiteralPath $item.FullName -Force -ErrorAction Stop
                            "[DELETED] $($item.FullName)" | Out-File -FilePath $LogFile -Append
                            $dirDeleted++
                            $script:actionsCount++
                        } catch {
                            "[LOCKED/FAILED] $($item.FullName) - Reason: $($_.Exception.Message)" | Out-File -FilePath $LogFile -Append
                            $dirFailed++
                        }
                    }
                }

                if ($dirFound -eq 0) {
                    $status = "NO_FILES_MATCHED"
                } elseif ($dirFailed -eq 0) {
                    $status = "SUCCESS"
                } else {
                    $status = "PARTIAL_FAILURE"
                }
            } else {
                $status = "NOT_FOUND"
                "[SKIPPED] Path does not exist: $Path" | Out-File -FilePath $LogFile -Append
            }

            $dirReport = [PSCustomObject]@{
                Path    = $Path
                Days    = $Days
                Filter  = $Filter
                Status  = $status
                Found   = $dirFound
                Deleted = $dirDeleted
                Failed  = $dirFailed
            }
            $script:directoryReports.Add($dirReport)
            "DIR_SUMMARY: [$status] $Path (Filter: $Filter, Found: $dirFound, Deleted: $dirDeleted, Failed: $dirFailed)" | Out-File -FilePath $LogFile -Append
        }

        try {
            # 1. C:\Temp\ (>7 days)
            Clean-DirectoryAge -Path 'C:\Temp' -Days 7 -Recurse

            # 2. C:\Windows\Temp\ (>7 days)
            Clean-DirectoryAge -Path 'C:\Windows\Temp' -Days 7 -Recurse

            # 3. C:\SYS\PERFLOG\Troubleshoot_CTR\ (>15 days)
            Clean-DirectoryAge -Path 'C:\SYS\PERFLOG\Troubleshoot_CTR' -Days 15 -Recurse

            # 4. C:\SYS\evtlog\sec\ (>15 days)
            Clean-DirectoryAge -Path 'C:\SYS\evtlog\sec' -Days 15 -Recurse

            # 5. C:\Windows\Installer\$PatchCache$\Managed\ (>15 days)
            Clean-DirectoryAge -Path 'C:\Windows\Installer\$PatchCache$\Managed' -Days 15 -Recurse

            # 6. C:\$Recycle.Bin\ (>15 days)
            Clean-DirectoryAge -Path 'C:\$Recycle.Bin' -Days 15 -Recurse

            # 7. IIS log directories (>30 days, *.log)
            Clean-DirectoryAge -Path 'C:\inetpub\logs\LogFiles' -Days 30 -Filter '*.log' -Recurse

            # 8. C:\Windows\ (mem*.dmp* >7 days)
            Clean-DirectoryAge -Path 'C:\Windows' -Days 7 -Filter 'mem*.dmp*'

            # 9. SCCM Cache Cleanup (>7 days unused based on LastReferenceTime)
            try {
                $sccmClient = New-Object -ComObject UIResource.UIResourceMgr -ErrorAction SilentlyContinue
                if ($sccmClient) {
                    $cacheElement = $sccmClient.GetCacheInfo()
                    $cutoffDate = (Get-Date).AddDays(-7)
                    $cacheElements = $cacheElement.GetCacheElements()
                    foreach ($elem in $cacheElements) {
                        if ($elem.LastReferenceTime -lt $cutoffDate) {
                            $cacheElement.DeleteCacheElement($elem.CacheElementID)
                            "[DELETED SCCM] Cache Element ID: $($elem.CacheElementID)" | Out-File -FilePath $LogFile -Append
                            $actionsCount++
                        }
                    }
                }
            } catch {
                "[WARN] SCCM cache cleanup skipped or not present: $($_.Exception.Message)" | Out-File -FilePath $LogFile -Append
            }

            # 10. Shadow Copies (>7 days) and Resize Storage Limit to 10%
            try {
                $shadowCutoff = (Get-Date).AddDays(-7).ToString("yyyy-MM-dd")
                $vssadminDel = vssadmin delete shadows /for=C: /shadow=$shadowCutoff /quiet 2>&1
                if ($LASTEXITCODE -eq 0) {
                    "[SHADOW COPY] Deleted shadow copies older than 7 days." | Out-File -FilePath $LogFile -Append
                    $actionsCount++
                }
                # Limit unbounded shadow copy storage to 10%
                vssadmin resize shadowstorage /for=C: /on=C: /maxsize=10% 2>&1 | Out-Null
            } catch {
                "[WARN] Shadow copy management encountered an issue: $($_.Exception.Message)" | Out-File -FilePath $LogFile -Append
            }

        } catch {
            $errObj = [PSCustomObject]@{
                Status           = 'EXECUTION_FAILED'
                ExitCode         = 20
                InitialFreePct   = $initialFreePct
                FinalFreePct     = (Get-CDiskInfo).FreePercent
                ActionsCount     = $actionsCount
                DirectorySummary = $directoryReports
                Message          = $_.Exception.Message
            }
            Write-Output ($errObj | ConvertTo-Json -Depth 4 -Compress)
            exit 20
        }

        # Post-cleanup metrics and final exit code assignment
        $finalDisk = Get-CDiskInfo
        $finalFreePct = $finalDisk.FreePercent

        if ($actionsCount -gt 0 -and $finalFreePct -ge 20) {
            $exitCode = 1
            $status = 'SUCCESSFUL_CLEANUP'
        } elseif ($actionsCount -gt 0 -and $finalFreePct -lt 20) {
            $exitCode = 2
            $status = 'PARTIAL_CLEANUP'
        } else {
            $exitCode = 3
            $status = 'NO_CLEANUP_PERFORMED'
        }

        $resultObj = [PSCustomObject]@{
            Status           = $status
            ExitCode         = $exitCode
            InitialFreePct   = $initialFreePct
            FinalFreePct     = $finalFreePct
            InitialFreeGB    = $initDisk.FreeGB
            FinalFreeGB      = $finalDisk.FreeGB
            TotalSizeGB      = $finalDisk.TotalGB
            ActionsCount     = $actionsCount
            DirectorySummary = $directoryReports
            Message          = 'Remediation executed.'
        }

        Write-Output ($resultObj | ConvertTo-Json -Depth 4 -Compress)
        exit $exitCode
        {% endraw %}
      register: housekeeping_raw
      failed_when: housekeeping_raw.rc not in [0, 1, 2, 3]
      changed_when: housekeeping_raw.rc in [1, 2]

    - name: Parse Remediation Output
      ansible.builtin.set_fact:
        cleanup_metrics: "{{ housekeeping_raw.stdout_lines[-1] | from_json }}"

    - name: Display Housekeeping Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "               DRIVE C: HOUSEKEEPING SUMMARY             "
          - "=========================================================="
          - " Host             : {{ inventory_hostname }}"
          - " Total Drive Size : {{ cleanup_metrics.TotalSizeGB }} GB"
          - " Pre-cleanup Free : {{ cleanup_metrics.InitialFreeGB }} GB ({{ cleanup_metrics.InitialFreePct }}%)"
          - " Post-cleanup Free: {{ cleanup_metrics.FinalFreeGB }} GB ({{ cleanup_metrics.FinalFreePct }}%)"
          - " Space Recovered  : {{ (cleanup_metrics.FinalFreeGB - cleanup_metrics.InitialFreeGB) | round(2) }} GB"
          - " Action Items Hit : {{ cleanup_metrics.ActionsCount }}"
          - " Message          : {{ cleanup_metrics.Message }}"
          - " Log Location     : C:\\Windows\\Build\\logs\\C_Housekeeping_ARF\\C_Housekeeping_ARF.log"
          - " Execution Status : {{ cleanup_metrics.Status }} (Exit Code: {{ cleanup_metrics.ExitCode }})"
          - "=========================================================="

    - name: Display Per-Directory Cleanup Audit
      ansible.builtin.debug:
        msg: >-
          [{{ item.Status | default('N/A') }}]
          Path: {{ item.Path }} |
          Filter: {{ item.Filter | default('*') }} |
          Age: >{{ item.Days }}d |
          Found: {{ item.Found }} |
          Deleted: {{ item.Deleted }} |
          Failed: {{ item.Failed }}
      loop: "{{ cleanup_metrics.DirectorySummary | default([]) }}"
      loop_control:
        label: "{{ item.Path }}"
