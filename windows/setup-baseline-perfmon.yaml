# =============================================================================
# Playbook Name : Setup_Baseline_PerfMon.yaml
#
# Synopsis :
#   Automates the deployment, validation, and lifecycle management of Windows
#   Performance Monitor (PerfMon) Baseline Data Collector Sets across target
#   Windows servers via Ansible Automation Platform (AAP). Ensures idempotent
#   execution, structured audit logging, and deterministic exit-code reporting.
#
# Exit Code Reference:
#   Exit 0  -> Baseline Monitoring Counters are already running, No action required
#   Exit 1  -> Completed BaseLine Performance Monitor setup
#   Exit 2  -> Failed to create Logs Folder
#   Exit 3  -> Failed to create Baseline & Setup Folder
#   Exit 4  -> Failed to copy setup files
#   Exit 5  -> Failed to create Task Scheduler
#   Exit 6  -> Failed to setup BaseLine Performance Monitor
#   Exit 20 -> Script / Playbook failed to execute (Unhandled / Default)
#
# Target        : Windows Servers
# Automation    : Ansible Automation Platform
# Monitoring    : Windows Performance Monitor / Logman
# Collector     : Baseline
# Sampling      : Every 60 seconds
# Duration      : 1440 samples (24 hours)
# Log Format    : CSV
# Log Location  : C:\PerfLogs\Baseline
# Audit Location: C:\PerfLogs\Logs
# Setup Location: C:\PerfLogs\Setup
#
# Prerequisites:
#   - Windows servers must be accessible through WinRM.
#   - Ansible Windows collection (ansible.windows) must be installed.
#   - AAP project workspace must contain files/Baseline.txt,
#     files/BaseLine_PerfMon_Task.xml, and files/BaseLine_Perfmon.ps1.
#   - Execution requires Windows local Administrator privileges.
# =============================================================================
---
- name: Setup Baseline Performance Monitoring on Windows Servers
  hosts: win-vm
  gather_facts: true

  vars:
    perflogs_base: 'C:\PerfLogs'
    log_dir: '{{ perflogs_base }}\Logs'
    csv_dir: '{{ perflogs_base }}\Baseline'
    setup_dir: '{{ perflogs_base }}\Setup'
    task_name: 'Baseline Performance Monitoring'
    setup_files:
      - Baseline.txt
      - BaseLine_PerfMon_Task.xml
      - BaseLine_Perfmon.ps1

  tasks:
    - name: Initialize host tracking facts (Default Exit 20)
      ansible.builtin.set_fact:
        log_file_stamp: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
        log_timestamp: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}"
        exit_code: 20
        setup_status: "PENDING"
        setup_message: "Exit 20 -> Script failed to execute"
        host_failed: false

    # Exit 2 Check: Create Logs Folder First

    - name: Ensure PerfLogs log directory exists (Exit 2)
      ansible.windows.win_file:
        path: "{{ log_dir }}"
        state: directory
      register: log_dir_result
      ignore_errors: true

    - name: Record Exit 2 failure if Logs folder creation failed
      ansible.builtin.set_fact:
        exit_code: 2
        setup_status: "FAILED"
        setup_message: "Exit 2 -> Failed to create Logs Folder | Detail: {{ log_dir_result.msg | default('Unknown error') }}"
        host_failed: true
      when: log_dir_result is failed


    # Exit 0 Check: Do Not Touch If Logman 'Baseline' Is Already Running

    - name: Check if Logman 'Baseline' counter set is currently running (Exit 0)
      ansible.windows.win_shell: logman.exe query "Baseline"
      register: precheck_logman
      changed_when: false
      failed_when: false
      when: not (host_failed | bool)

    - name: Mark Exit 0 if Baseline Monitoring Counters are already running
      ansible.builtin.set_fact:
        exit_code: 0
        setup_status: "SKIPPED"
        setup_message: "Exit 0 -> Baseline Monitoring Counters are already running, No action required"
      when:
        - not (host_failed | bool)
        - precheck_logman.rc == 0
        - (precheck_logman.stdout | regex_search('(?m)^Status:\s+Running\s*$')) is not none

 
    # Main Setup Block: Maps Exits 3, 4, 5, 6 -> Exit 1 on Completion

    - name: Execute Baseline Performance Monitor Setup
      when:
        - not (host_failed | bool)
        - (exit_code | int) != 0
      block:            
        - name: Ensure PerfLogs directories exist (Baseline, Setup)
          ansible.windows.win_file:
            path: "{{ item }}"
            state: directory
          loop:
            - "{{ csv_dir }}"
            - "{{ setup_dir }}"
          vars:
            step_exit_code: 3
            step_error_label: "Exit 3 -> Failed to create Baseline & Setup Folder"

        - name: Copy Baseline setup files from AAP project workspace
          ansible.windows.win_copy:
            src: "{{ playbook_dir }}/files/{{ item }}"
            dest: '{{ setup_dir }}\{{ item }}'
            force: true
          loop: "{{ setup_files }}"
          vars:
            step_exit_code: 4
            step_error_label: "Exit 4 -> Failed to copy setup files"

        - name: Import/Recreate Scheduled Task from XML
          ansible.windows.win_shell: |
            $TaskName = "{{ task_name }}"
            $XmlPath = "{{ setup_dir }}\BaseLine_PerfMon_Task.xml"

            if (-not (Test-Path $XmlPath)) {
               throw "Scheduled Task XML not found: $XmlPath"
            }

            $TaskXml = Get-Content -Path $XmlPath -Raw
            Register-ScheduledTask `
                -TaskName $TaskName `
                -Xml $TaskXml `
                -Force
            Enable-ScheduledTask -TaskName $TaskName
          vars:
            step_exit_code: 5
            step_error_label: "Exit 5 -> Failed to create Task Scheduler"

        - name: Create and start Logman 'Baseline' counter set
          ansible.windows.win_shell: |
            logman delete "Baseline" 2>$null
            logman create counter "Baseline" -o "{{ csv_dir }}\{{ ansible_hostname }}" -f csv -v mmddhhmm -cf "{{ setup_dir }}\Baseline.txt" -sc 1440 -si 60
            if ($LASTEXITCODE -ne 0) { exit 1 }
            logman start "Baseline"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          vars:
            step_exit_code: 6
            step_error_label: "Exit 6 -> Failed to setup BaseLine Performance Monitor"

        - name: Verify Logman 'Baseline' counter set is running
          ansible.windows.win_shell: logman query "Baseline"
          register: verify_logman
          changed_when: false
          failed_when: >-
            verify_logman.rc != 0 or
            (verify_logman.stdout | regex_search('(?m)^Status:\s+Running\s*$')) is none
          vars:
            step_exit_code: 6
            step_error_label: "Exit 6 -> Failed to setup BaseLine Performance Monitor"

        - name: Record Exit 1 (Successful setup)
          ansible.builtin.set_fact:
            exit_code: 1
            setup_status: "SUCCESS"
            setup_message: "Exit 1 -> Completed BaseLine Performance Monitor setup"

      rescue:
        - name: Map failed task to exact Exit Code (3-6 or 20)
          ansible.builtin.set_fact:
            exit_code: "{{ ansible_failed_task.vars.step_exit_code | default(20) }}"
            setup_status: "FAILED"
            setup_message: >-
              {{ ansible_failed_task.vars.step_error_label | default('Exit 20 -> Script failed to execute') }} |
              Detail: {{ ansible_failed_result.msg |
              default(ansible_failed_result.stderr |
              default(ansible_failed_result.stdout |
              default('No additional error details available'))) }}
            host_failed: true

    # Audit Logging (Runs whenever Logs directory succeeded, i.e., Exit != 2)
    
    - name: Write audit entry to local PerfLogs log file
      ansible.windows.win_lineinfile:
        path: '{{ log_dir }}\BaseLine_{{ log_file_stamp }}.log'
        line: "{{ log_timestamp }} - AAP Job {{ awx_job_id | default('Manual') }} [Exit {{ exit_code }}]: {{ setup_status }} - {{ setup_message }}"
        create: true
      when: (exit_code | int) != 2

    # AAP Reporting: Artifacts Tab + Console Output + Accurate Job Exit Status

    - name: Publish summary to AAP Job Artifacts tab
      ansible.builtin.set_stats:
        data:
          perfmon_baseline_summary:
            "{{ inventory_hostname }}":
              hostname: "{{ ansible_hostname }}"
              exit_code: "{{ exit_code | int }}"
              status: "{{ setup_status }}"
              details: "{{ setup_message }}"
        per_host: false
        aggregate: true

    - name: Display Host Setup Summary in AAP Job Output
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HOST SUMMARY : {{ inventory_hostname }} ({{ ansible_hostname }})"
          - "EXIT CODE    : {{ exit_code }}"
          - "STATUS       : {{ setup_status }}"
          - "DETAILS      : {{ setup_message }}"
          - "============================================================"

    - name: Fail host in AAP if setup encountered an error
      ansible.builtin.fail:
        msg: "{{ setup_message }}"
      when: host_failed | bool
