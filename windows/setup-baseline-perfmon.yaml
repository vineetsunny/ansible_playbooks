---
- name: Setup Baseline Performance Monitoring on Windows Servers
  hosts: win-vm
  gather_facts: true

  vars:
    perflogs_base: 'C:\PerfLogs'
    log_dir: '{{ perflogs_base }}\Logs'
    csv_dir: '{{ perflogs_base }}\Baseline'
    setup_dir: '{{ perflogs_base }}\Setup'
    task_name: 'Baseline Performance Monitoring'
    setup_files:
      - Baseline.txt
      - BaseLine_PerfMon_Task.xml
      - BaseLine_Perfmon.ps1

  tasks:
    - name: Initialize host tracking facts
      ansible.builtin.set_fact:
        file_suffix: "{{ lookup('pipe', 'date +%m%d') }}"
        log_file_stamp: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
        log_timestamp: "{{ lookup('pipe', 'date \"+%Y-%m-%d %H:%M:%S\"') }}"
        setup_status: "PENDING"
        setup_message: ""
        host_failed: false

    - name: Check if today's baseline log file already exists (Exit 0 logic)
      ansible.windows.win_find:
        paths: "{{ csv_dir }}"
        patterns: "{{ ansible_hostname }}_{{ file_suffix }}*"
      register: existing_baseline_file
      ignore_errors: true

    - name: Mark host as skipped if Baseline Perfmon is already running today
      ansible.builtin.set_fact:
        setup_status: "SKIPPED"
        setup_message: "Baseline file for today ({{ ansible_hostname }}_{{ file_suffix }}*) already exists. No action required."
      when: existing_baseline_file.matched is defined and existing_baseline_file.matched > 0

    # Main Setup Block
    - name: Execute Baseline Performance Monitor Setup
      when: existing_baseline_file.matched is not defined or existing_baseline_file.matched == 0
      block:
        - name: Ensure PerfLogs directories exist (Baseline, Setup)
          ansible.windows.win_file:
            path: "{{ item }}"
            state: directory
          loop:
            - "{{ csv_dir }}"
            - "{{ setup_dir }}"

        - name: Copy Baseline setup files from AAP project workspace
          ansible.windows.win_copy:
            src: "{{ playbook_dir }}/files/{{ item }}"
            dest: '{{ setup_dir }}\{{ item }}'
            force: true
          loop: "{{ setup_files }}"

        - name: Import/Recreate Scheduled Task from XML
          ansible.windows.win_shell: |
            $TaskName = "{{ task_name }}"
            $XmlPath = "{{ setup_dir }}\BaseLine_PerfMon_Task.xml"

            if (-not (Test-Path $XmlPath)) {
               throw "Scheduled Task XML not found: $XmlPath"
            }

            $TaskXml = Get-Content -Path $XmlPath -Raw
            Register-ScheduledTask `
                -TaskName $TaskName `
                -Xml $TaskXml `
                -Force
            Enable-ScheduledTask -TaskName $TaskName

        - name: Check current status of Logman 'Baseline' Data Collector Set
          ansible.windows.win_shell: |
            $query = & logman.exe query "Baseline" 2>&1
            $exitCode = $LASTEXITCODE

            if ($exitCode -ne 0) {
                Write-Output "NOT_FOUND"
            }
            elseif (($query | Out-String) -match "Status:\s+Running") {
                Write-Output "RUNNING"
            }
            else {
                Write-Output "STOPPED"
            }
          register: logman_status
          changed_when: false
          failed_when: false

        - name: Recreate and start Logman 'Baseline' counter set if missing or stopped
          ansible.windows.win_shell: |
            logman delete "Baseline" 2>$null
            logman create counter "Baseline" -o "{{ csv_dir }}\{{ ansible_hostname }}" -f csv -v mmddhhmm -cf "{{ setup_dir }}\Baseline.txt" -sc 1440 -si 60
            logman start "Baseline"
          when: (logman_status.stdout | default('') | trim) != "RUNNING"

        - name: Verify Logman 'Baseline' counter set is running
          ansible.windows.win_shell: logman query "Baseline"
          register: verify_logman
          changed_when: false
          failed_when: >-
            verify_logman.rc != 0 or
            (verify_logman.stdout | regex_search('(?m)^Status:\s+Running\s*$')) is none

        - name: Record successful setup status
          ansible.builtin.set_fact:
            setup_status: "SUCCESS"
            setup_message: "Directories created, files copied, Scheduled Task registered, and Logman 'Baseline' counter is Running."

      rescue:
        - name: Record failure status if any task in the block failed
          ansible.builtin.set_fact:
            setup_status: "FAILED"
            setup_message: >-
              Failed at task '{{ ansible_failed_task.name }}'.
              Error: {{ ansible_failed_result.msg |
              default(ansible_failed_result.stderr |
              default(ansible_failed_result.stdout |
              default('No additional error details available'))) }}
            host_failed: true

    # Always write audit log (runs for SUCCESS, FAILED, and SKIPPED)
    - name: Ensure PerfLogs log directory exists
      ansible.windows.win_file:
        path: "{{ log_dir }}"
        state: directory

    - name: Write audit entry to local PerfLogs log file
      ansible.windows.win_lineinfile:
        path: '{{ log_dir }}\BaseLine_{{ log_file_stamp }}.log'
        line: "{{ log_timestamp }} - AAP Job {{ awx_job_id | default('Manual') }}: {{ setup_status }} - {{ setup_message }}"
        create: true

    # AAP Reporting: Artifacts Tab + Console Output + Accurate Job Exit Status
    - name: Publish summary to AAP Job Artifacts tab
      ansible.builtin.set_stats:
        data:
          perfmon_baseline_summary:
            "{{ inventory_hostname }}":
              hostname: "{{ ansible_hostname }}"
              status: "{{ setup_status }}"
              details: "{{ setup_message }}"
        per_host: false
        aggregate: true

    - name: Display Host Setup Summary in AAP Job Output
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HOST SUMMARY : {{ inventory_hostname }} ({{ ansible_hostname }})"
          - "STATUS       : {{ setup_status }}"
          - "DETAILS      : {{ setup_message }}"
          - "============================================================"

    - name: Fail host in AAP if setup encountered an error
      ansible.builtin.fail:
        msg: "{{ setup_message }}"
      when: host_failed | bool
