# =============================================================================
# Playbook Name : otel-hygiene.yml
#
# Purpose       : Monitor and remediate the OpenTelemetry Collector service
#                 on Windows servers by cleaning excessive log files,
#                 updating memory and spike limits, and ensuring the
#                 service is running with Automatic Delayed Start.
#
# Scope         : Windows servers / VMs
# Application   : OpenTelemetry Collector
# Service Name  : Otel
# Expected Version: 0.96.0.0
#
# Log File Path : C:\Windows\CWS Build\Logs\otel-debug.log
# Maximum Log Size : 5 MB
# Log Retention : Latest 500 lines
#
# Install Path  : C:\Program Files\Otel-Collector
# Config Path   : C:\Program Files\Otel-Collector\conf\otel-config.yaml
#
# Configuration:
#   - Memory Limit    : 650 MiB
#   - Spike Limit     : 130 MiB
#   - Startup Type    : Automatic Delayed Start
#   - Service State   : Running
#
# Prerequisites:
#   - Ansible connectivity to the target Windows servers through WinRM.
#   - Appropriate Windows administrator privileges.
#   - The ansible.windows collection installed on the Ansible control node.
#   - OpenTelemetry Collector installed and registered as a Windows service.
#   - Service name must match the configured value in the playbook.
#   - Access to the OpenTelemetry installation, configuration and log paths.
#   - Configuration file must exist and contain the expected memory and
#     spike limit settings.
#
# Execution     : ansible-playbook -i inventory.ini otel-agent-remediation.yml
#
# Important     : The playbook checks the installed OpenTelemetry Collector
#                 version and service startup mode before proceeding.
#
#                 If the installed version matches the expected version
#                 (0.96.0.0), or the service startup mode is Disabled,
#                 remediation is skipped.
#
#                 When remediation is allowed, the playbook:
#                   - Cleans the log file if its size exceeds 5 MB.
#                   - Retains the latest 500 log entries.
#                   - Updates memory limit to 650 MiB when required.
#                   - Updates spike limit to 130 MiB when required.
#                   - Restarts the service when configuration changes.
#                   - Configures Automatic Delayed Start when required.
#                   - Starts the service if it is not running.
#
#                 The playbook does not install or upgrade OpenTelemetry
#                 Collector. Validate the version-check and skip conditions
#                 before production execution.
#
# Exit Codes    : 0  - No remediation required or remediation skipped
#                 1  - All attempted remediation actions succeeded
#                 2  - Partial success
#                 3  - All attempted remediation actions failed
#
# Version       : 1.0
# =============================================================================

---
- name: OpenTelemetry Agent Remediation
  hosts: test-vm
  gather_facts: false

  vars:
    otel_service_name: "Otel"
    #otel_expected_version: "0.96.0.0"
    otel_expected_version: "0.164.0.0"
    otel_log_file: 'C:\Windows\CWS Build\Logs\otel-debug.log'
    otel_max_log_size: 5242880
    otel_keep_log_lines: 500

    otel_config_file: 'C:\Program Files\Otel-Collector\conf\otel-config.yaml'

    otel_memory_limit: 650
    otel_spike_limit: 130

  tasks:

    # Initialize remediation counters

    - name: Initialize remediation counters
      ansible.builtin.set_fact:
        remediation_success: 0
        remediation_failure: 0
        config_changed: false
        exit_code: 0
        remediation_actions: []
        skip_reason: ""
        skip_remediation: false

    # Check Otel service

    - name: Check whether Otel service exists
      ansible.windows.win_service_info:
        name: "{{ otel_service_name }}"
      register: otel_service_info

    - name: Display Otel service information
      ansible.builtin.debug:
        msg: "Otel service exists: {{ otel_service_info.services | length > 0 }}"

    # Stop remediation if service does not exist

    - name: Set skip remediation flag
      ansible.builtin.set_fact:
        skip_remediation: true
      when: otel_service_info.services | length == 0

    - name: Record missing service skip reason
      ansible.builtin.set_fact:
        skip_reason: "Otel service '{{ otel_service_name }}' is not installed"
      when: otel_service_info.services | length == 0

    - name: Check installed Otel Collector version
      ansible.windows.win_powershell:
        script: |
          $version = ""
          $foundSource = "None"

          # 1. Locate binary from the Otel Windows Service definition
          $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name = '{{ otel_service_name }}'" -ErrorAction SilentlyContinue
          $exePath = $null

          if ($svc -and $svc.PathName) {
              $rawPath = $svc.PathName.Trim()
              if ($rawPath.StartsWith('"')) {
                  $exePath = $rawPath.Split('"')[1]
              } else {
                  $exePath = $rawPath.Split(' ')[0]
              }
          }

          # Fallback path if service query failed
          if (-not $exePath -or -not (Test-Path -LiteralPath $exePath)) {
              $defaultPaths = @(
                  'C:\Program Files\Otel-Collector\otelcol.exe',
                  'C:\Program Files\OpenTelemetry Collector\otelcol.exe',
                  'C:\Program Files\otelcol\otelcol.exe'
              )
              foreach ($p in $defaultPaths) {
                  if (Test-Path -LiteralPath $p) {
                      $exePath = $p
                      break
                  }
              }
          }

          # 2. Extract version by running CLI flag (Standard for Go / Otel binaries)
          if ($exePath -and (Test-Path -LiteralPath $exePath)) {
              try {
                  $cliOutput = & "$exePath" --version 2>&1 | Out-String
                  if ($cliOutput -match '(\d+\.\d+\.\d+(\.\d+)?)') {
                      $version = $Matches[1]
                      $foundSource = "CLI (--version): $exePath"
                  }
              } catch {
                  # In case execution fails, continue to next method
              }

              # 3. Check File VersionInfo if CLI didn't yield a result
              if ([string]::IsNullOrWhiteSpace($version)) {
                  $fInfo = (Get-Item -LiteralPath $exePath).VersionInfo
                  $v = ($fInfo.ProductVersion, $fInfo.FileVersion | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
                  if ($v) {
                      $version = $v.Trim()
                      $foundSource = "PE Header: $exePath"
                  }
              }
          }

          # 4. Fallback to Registry if still empty
          if ([string]::IsNullOrWhiteSpace($version)) {
              $uninstallPaths = @(
                  'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
              )
              foreach ($path in $uninstallPaths) {
                  $app = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -match 'otel|opentelemetry' } |
                      Select-Object -First 1
                  if ($app -and $app.DisplayVersion) {
                      $version = ($app.DisplayVersion | Out-String).Trim()
                      $foundSource = "Registry: $($app.DisplayName)"
                      break
                  }
              }
          }

          $Ansible.Result = @{
              version      = [string]$version
              found_source = [string]$foundSource
          }
      register: otel_version_check
      when: not (skip_remediation | default(false) | bool)

    - name: Display detected Otel version and check details
      ansible.builtin.debug:
        msg:
          - "--- OTEL VERSION INSPECTION ---"
          - "Raw Detected Version: '{{ otel_version_check.result.version | default('NOT FOUND / EMPTY') }}'"
          - "Expected Version:     '{{ otel_expected_version }}'"
          - "Does it match?:        {{ (otel_version_check.result.version | default('')) == otel_expected_version }}"
          - "Service Start Mode:    '{{ otel_service_info.services[0].start_mode | default('UNKNOWN') }}'"
          - "--------------------------------"
      when: not (skip_remediation | default(false) | bool)

    - name: Skip remediation for matching version or disabled service
      ansible.builtin.set_fact:
        skip_remediation: true
      when:
        - not (skip_remediation | default(false) | bool)
        - >-
          (otel_expected_version in (otel_version_check.result.version | default('')))
          or (otel_version_check.result.version | default('') in otel_expected_version)
          or (otel_service_info.services[0].start_mode | default('') == 'disabled')

    - name: Record version or disabled-service skip reason
      ansible.builtin.set_fact:
        skip_reason: >-
          {% if (otel_version_check.result.version if otel_version_check is defined else '') == otel_expected_version %}
          Installed Otel version already matches expected version {{ otel_expected_version }} (No action required)
          {% else %}
          Otel service startup mode is Disabled
          {% endif %}
      when:
        - skip_remediation | default(false) | bool
        - otel_service_info.services | length > 0

    - name: Record overall remediation skip
      ansible.builtin.set_fact:
        remediation_actions: "{{ remediation_actions + ['NO ACTION REQUIRED - ' ~ (skip_reason | trim)] }}"
      when: skip_remediation | default(false) | bool

    # The 'ansible.builtin.meta: end_host' task is removed here so the remaining tasks can complete to summary

    - name: Check Otel log file size
      ansible.windows.win_powershell:
        script: |
          $file = Get-Item -LiteralPath "{{ otel_log_file }}" -ErrorAction SilentlyContinue

          if ($file) {
              $Ansible.Result = @{
                  exists = $true
                  size = $file.Length
              }
          }
          else {
              $Ansible.Result = @{
                  exists = $false
                  size = 0
              }
          }
      register: otel_log_info
      when: not (skip_remediation | default(false) | bool)

    - name: Read current Otel configuration
      ansible.windows.win_powershell:
        script: |
          $path = "{{ otel_config_file }}"

          if (-not (Test-Path -LiteralPath $path)) {
              $Ansible.Result = @{
                  config_exists = $false
                  memory_limit = $null
                  spike_limit = $null
                  memory_key_present = $false
                  spike_key_present = $false
              }
              return
          }

          $content = Get-Content -LiteralPath $path -Raw

          $memory = [regex]::Match(
              $content,
              '(?m)^\s*limit_mib\s*:\s*(\d+)'
          )

          $spike = [regex]::Match(
              $content,
              '(?m)^\s*spike_limit_mib\s*:\s*(\d+)'
          )

          $Ansible.Result = @{
              config_exists = $true
              memory_limit = if ($memory.Success) { $memory.Groups[1].Value } else { $null }
              spike_limit = if ($spike.Success) { $spike.Groups[1].Value } else { $null }
              memory_key_present = $memory.Success
              spike_key_present = $spike.Success
          }
      register: otel_config_info
      when: not (skip_remediation | default(false) | bool)

    # Clean up old log entries

    - name: Clean up Otel log file
      block:
        - name: Retain latest 500 log entries
          ansible.windows.win_powershell:
            script: |
              $path = "{{ otel_log_file }}"
              $maxSize = {{ otel_max_log_size }}

              if (Test-Path -LiteralPath $path) {
                  $file = Get-Item -LiteralPath $path

                  if ($file.Length -gt $maxSize) {
                      $content = Get-Content -LiteralPath $path -ErrorAction Stop |
                          Select-Object -Last {{ otel_keep_log_lines }}

                      Set-Content -LiteralPath $path -Value $content -ErrorAction Stop

                      $newFile = Get-Item -LiteralPath $path

                      $Ansible.Result = @{
                          success = ($newFile.Length -le $maxSize)
                          size = $newFile.Length
                      }
                  }
                  else {
                      $Ansible.Result = @{
                          success = $true
                          skipped = $true
                      }
                  }
              }
              else {
                  $Ansible.Result = @{
                      success = $true
                      skipped = $true
                  }
              }
          register: log_cleanup_result
          changed_when: >
            log_cleanup_result.result.success
            and not (log_cleanup_result.result.skipped | default(false))

        - name: Count log cleanup success
          ansible.builtin.set_fact:
            remediation_success: "{{ remediation_success | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['SUCCESS - Log cleanup: retained latest ' ~ (otel_keep_log_lines | string) ~ ' lines'] }}"
          when:
            - log_cleanup_result.result.success | default(false)
            - not (log_cleanup_result.result.skipped | default(false))

        - name: Count log cleanup failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Log cleanup: operation did not complete successfully'] }}"
          when: not (log_cleanup_result.result.success | default(false))

      rescue:
        - name: Record log cleanup failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Log cleanup: unexpected error during cleanup'] }}"

      when:
        - not (skip_remediation | default(false) | bool)
        - otel_log_info.result.exists | default(false)
        - otel_log_info.result.size | int > otel_max_log_size

    - name: Record log cleanup skipped
      ansible.builtin.set_fact:
        remediation_actions: >-
          {{ remediation_actions + [
            'SKIPPED - Log cleanup: ' ~
            ('log file does not exist' if not (otel_log_info.result.exists | default(false))
             else 'file size is within the configured 5 MiB threshold')
          ] }}
      when:
        - not (skip_remediation | default(false) | bool)
        - not (otel_log_info.result.exists | default(false) or
               (otel_log_info.result.size | int > otel_max_log_size))

    - name: Record missing Otel configuration file
      ansible.builtin.set_fact:
        remediation_failure: "{{ remediation_failure | int + 1 }}"
        remediation_actions: "{{ remediation_actions + ['FAILED - Configuration: Otel config file is missing; configuration was not modified'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - not (otel_config_info.result.config_exists | default(false) | bool)

    # Update memory limit

    - name: Update Otel memory limit
      block:
        - name: Configure memory limit to 650 MiB
          ansible.windows.win_lineinfile:
            path: "{{ otel_config_file }}"
            regex: '^\s*limit_mib\s*:'
            line: "    limit_mib: {{ otel_memory_limit }}"
            backup: true
          register: memory_update_result

        - name: Validate memory limit
          ansible.windows.win_powershell:
            script: |
              $content = Get-Content -LiteralPath "{{ otel_config_file }}" -Raw

              $match = [regex]::Match(
                  $content,
                  '(?m)^\s*limit_mib\s*:\s*(\d+)'
              )

              $Ansible.Result = @{
                  success = $match.Success -and
                            $match.Groups[1].Value -eq "{{ otel_memory_limit }}"
              }
          register: memory_validation

        - name: Count memory update success
          ansible.builtin.set_fact:
            remediation_success: "{{ remediation_success | int + 1 }}"
            config_changed: "{{ config_changed or memory_update_result.changed }}"
            remediation_actions: "{{ remediation_actions + ['SUCCESS - Memory limit: configured and validated at ' ~ (otel_memory_limit | string) ~ ' MiB'] }}"
          when: memory_validation.result.success | default(false)

        - name: Count memory update failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Memory limit: update or validation failed'] }}"
          when: not (memory_validation.result.success | default(false))

      rescue:
        - name: Record memory update failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Memory limit: unexpected error during update'] }}"

      when:
        - not (skip_remediation | default(false) | bool)
        - otel_config_info.result.config_exists | default(false) | bool
        - otel_config_info.result.memory_key_present | default(false) | bool
        - otel_config_info.result.memory_limit | default('') != (otel_memory_limit | string)

    - name: Record missing memory limit key
      ansible.builtin.set_fact:
        remediation_failure: "{{ remediation_failure | int + 1 }}"
        remediation_actions: "{{ remediation_actions + ['FAILED - Memory limit: limit_mib key is missing; configuration was not modified'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - otel_config_info.result.config_exists | default(false) | bool
        - not (otel_config_info.result.memory_key_present | default(false) | bool)

    - name: Record memory update skipped
      ansible.builtin.set_fact:
        remediation_actions: "{{ remediation_actions + ['SKIPPED - Memory limit: already set to ' ~ (otel_memory_limit | string) ~ ' MiB'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - otel_config_info.result.config_exists | default(false) | bool
        - otel_config_info.result.memory_key_present | default(false) | bool
        - otel_config_info.result.memory_limit | default('') == (otel_memory_limit | string)

    # Update spike limit

    - name: Update Otel spike limit
      block:
        - name: Configure spike limit to 130 MiB
          ansible.windows.win_lineinfile:
            path: "{{ otel_config_file }}"
            regex: '^\s*spike_limit_mib\s*:'
            line: "    spike_limit_mib: {{ otel_spike_limit }}"
            backup: true
          register: spike_update_result

        - name: Validate spike limit
          ansible.windows.win_powershell:
            script: |
              $content = Get-Content -LiteralPath "{{ otel_config_file }}" -Raw

              $match = [regex]::Match(
                  $content,
                  '(?m)^\s*spike_limit_mib\s*:\s*(\d+)'
              )

              $Ansible.Result = @{
                  success = $match.Success -and
                            $match.Groups[1].Value -eq "{{ otel_spike_limit }}"
              }
          register: spike_validation

        - name: Count spike update success
          ansible.builtin.set_fact:
            remediation_success: "{{ remediation_success | int + 1 }}"
            config_changed: "{{ config_changed or spike_update_result.changed }}"
            remediation_actions: "{{ remediation_actions + ['SUCCESS - Spike limit: configured and validated at ' ~ (otel_spike_limit | string) ~ ' MiB'] }}"
          when: spike_validation.result.success | default(false)

        - name: Count spike update failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Spike limit: update or validation failed'] }}"
          when: not (spike_validation.result.success | default(false))

      rescue:
        - name: Record spike update failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Spike limit: unexpected error during update'] }}"

      when:
        - not (skip_remediation | default(false) | bool)
        - otel_config_info.result.config_exists | default(false) | bool
        - otel_config_info.result.spike_key_present | default(false) | bool
        - otel_config_info.result.spike_limit | default('') != (otel_spike_limit | string)

    - name: Record missing spike limit key
      ansible.builtin.set_fact:
        remediation_failure: "{{ remediation_failure | int + 1 }}"
        remediation_actions: "{{ remediation_actions + ['FAILED - Spike limit: spike_limit_mib key is missing; configuration was not modified'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - otel_config_info.result.config_exists | default(false) | bool
        - not (otel_config_info.result.spike_key_present | default(false) | bool)

    - name: Record spike update skipped
      ansible.builtin.set_fact:
        remediation_actions: "{{ remediation_actions + ['SKIPPED - Spike limit: already set to ' ~ (otel_spike_limit | string) ~ ' MiB'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - otel_config_info.result.config_exists | default(false) | bool
        - otel_config_info.result.spike_key_present | default(false) | bool
        - otel_config_info.result.spike_limit | default('') == (otel_spike_limit | string)

    # Restart service after configuration changes

    - name: Restart Otel service after configuration changes
      block:
        - name: Restart Otel service
          ansible.windows.win_service:
            name: "{{ otel_service_name }}"
            state: restarted
          register: otel_restart_result

        - name: Verify Otel service is running
          ansible.windows.win_service_info:
            name: "{{ otel_service_name }}"
          register: otel_restart_validation

        - name: Count service restart success
          ansible.builtin.set_fact:
            remediation_success: "{{ remediation_success | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['SUCCESS - Otel service: restarted and verified running'] }}"
          when: otel_restart_validation.services[0].state == 'started'

        - name: Count service restart failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Otel service: restart validation failed'] }}"
          when: otel_restart_validation.services[0].state != 'started'

      rescue:
        - name: Record service restart failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Otel service: unexpected error during restart'] }}"

      when:
        - not (skip_remediation | default(false) | bool)
        - config_changed | bool

    - name: Record service restart skipped
      ansible.builtin.set_fact:
        remediation_actions: "{{ remediation_actions + ['SKIPPED - Service restart: no configuration changes were made'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - not (config_changed | bool)

    # Set service startup type to Automatic Delayed Start

    - name: Configure Otel service startup type
      block:
        - name: Set Otel service to Automatic Delayed Start
          ansible.windows.win_service:
            name: "{{ otel_service_name }}"
            start_mode: delayed
          register: startup_update_result

        - name: Verify Otel startup type
          ansible.windows.win_service_info:
            name: "{{ otel_service_name }}"
          register: startup_validation

        - name: Count startup configuration success
          ansible.builtin.set_fact:
            remediation_success: "{{ remediation_success | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['SUCCESS - Service startup: set to Automatic Delayed Start'] }}"
          when: startup_validation.services[0].start_mode == 'delayed'

        - name: Count startup configuration failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Service startup: delayed-start validation failed'] }}"
          when: startup_validation.services[0].start_mode != 'delayed'

      rescue:
        - name: Record startup configuration failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Service startup: unexpected error configuring delayed start'] }}"

      when:
        - not (skip_remediation | default(false) | bool)
        - otel_service_info.services[0].start_mode != 'delayed'

    - name: Record startup configuration skipped
      ansible.builtin.set_fact:
        remediation_actions: "{{ remediation_actions + ['SKIPPED - Service startup: already set to Automatic Delayed Start'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - otel_service_info.services[0].start_mode == 'delayed'

    # Start Otel service if not running

    - name: Start Otel service if stopped
      block:
        - name: Ensure Otel service is running
          ansible.windows.win_service:
            name: "{{ otel_service_name }}"
            state: started
          register: service_start_result

        - name: Verify Otel service status
          ansible.windows.win_service_info:
            name: "{{ otel_service_name }}"
          register: service_start_validation

        - name: Count service start success
          ansible.builtin.set_fact:
            remediation_success: "{{ remediation_success | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['SUCCESS - Otel service: started and verified running'] }}"
          when: service_start_validation.services[0].state == 'started'

        - name: Count service start failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Otel service: start validation failed'] }}"
          when: service_start_validation.services[0].state != 'started'

      rescue:
        - name: Record service start failure
          ansible.builtin.set_fact:
            remediation_failure: "{{ remediation_failure | int + 1 }}"
            remediation_actions: "{{ remediation_actions + ['FAILED - Otel service: unexpected error while starting'] }}"

      when:
        - not (skip_remediation | default(false) | bool)
        - otel_service_info.services[0].state != 'started'

    - name: Record service start skipped
      ansible.builtin.set_fact:
        remediation_actions: "{{ remediation_actions + ['SKIPPED - Otel service: already running'] }}"
      when:
        - not (skip_remediation | default(false) | bool)
        - otel_service_info.services[0].state == 'started'

    # Calculate final exit code

    - name: Determine final remediation exit code
      ansible.builtin.set_fact:
        exit_code: >-
          {% if skip_remediation | default(false) | bool %}
          0
          {% elif remediation_success | int > 0 and remediation_failure | int == 0 %}
          1
          {% elif remediation_success | int > 0 and remediation_failure | int > 0 %}
          2
          {% elif remediation_success | int == 0 and remediation_failure | int > 0 %}
          3
          {% else %}
          0
          {% endif %}

    # Display remediation summary

    - name: Display Otel remediation summary
      ansible.builtin.debug:
        msg: >-
          {{
            [
              "========== OTEL REMEDIATION SUMMARY ==========",
              "Status: " ~ ("NO ACTION REQUIRED" if (skip_remediation | default(false) | bool) else "REMEDIATION PROCESSED"),
              "Actions:"
            ]
            +
            (remediation_actions if (remediation_actions | length > 0) else ["- No remediation actions recorded"])
            +
            [
              "Successful actions: " ~ (remediation_success | int),
              "Failed actions: " ~ (remediation_failure | int),
              "Final Exit Code: " ~ (exit_code | trim),
              "=============================================="
            ]
          }}

    # Publish exit code for AAP

    - name: Publish remediation exit code
      ansible.builtin.set_stats:
        data:
          otel_remediation_exit_code: "{{ exit_code | trim | int }}"
          otel_remediation_success: "{{ remediation_success | int }}"
          otel_remediation_failure: "{{ remediation_failure | int }}"
