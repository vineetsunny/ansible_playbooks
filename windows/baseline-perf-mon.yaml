# =============================================================================
# Playbook Name : baseline-perf-mon.yaml
# Description   : Automates baseline performance monitoring on Windows VMs,
#                 including disk-space checks, historical file cleanup,
#                 CSV compression, and performance reporting.
#
# Purpose       : Maintain Windows VM performance monitoring while managing
#                 disk space through retention-based cleanup and compression.
#
# Scope         : Windows servers / VMs
# Target FS     : C:
# Retention     : 30 days when free space is >= 2.5 GB;
#                 15 days when free space is >= 1 GB and < 2.5 GB.
# Compression   : Previous-day baseline CSV files
# Collector     : Baseline
# Scheduled Task: Baseline Performance Monitoring (daily trigger)
# Output Path   : C:\PerfLogs\Baseline
# Log Path      : C:\PerfLogs\Logs
# Setup Path    : C:\PerfLogs\Setup
#
# Prerequisites:
#   - Ansible connectivity to the target Windows VM through WinRM.
#   - Required PowerShell and Windows Performance Monitor utilities.
#   - Required configuration files:
#       C:\PerfLogs\Setup\BASELINE.TXT
#       C:\PerfLogs\Setup\BaseLine_PerfMon_Task.xml
#   - Appropriate permissions to configure the collector, scheduled task,
#     and delete or compress monitoring files.
#
# Execution     : ansible-playbook -i inventory windows-baseline-monitoring.yml
#
# Important     : If C: has less than 1 GB free, monitoring setup and
#                 maintenance are skipped. Cleanup and compression run when
#                 the Ansible playbook executes; the Windows scheduled task
#                 only attempts to start the performance collector daily.
#                 Files older than the selected retention period are
#                 permanently deleted from the configured cleanup folders.
#
# Version       : 1.0
# =============================================================================
---
- name: Configure Windows Baseline Performance Monitoring
  hosts: test-vm
  gather_facts: false

  vars:
    perf_root: 'C:\PerfLogs'
    log_path: 'C:\PerfLogs\Logs'
    csv_path: 'C:\PerfLogs\Baseline'
    setup_path: 'C:\PerfLogs\Setup'

    counter_file: 'C:\PerfLogs\Setup\BASELINE.TXT'
    task_xml: 'C:\PerfLogs\Setup\BaseLine_PerfMon_Task.xml'
    task_name: 'Baseline Performance Monitoring'
    collector_name: 'Baseline'

    minimum_free_space_gb: 1.0
    high_space_threshold_gb: 2.5
    high_space_retention_days: 30
    low_space_retention_days: 15

  tasks:
    - name: Test WinRM connectivity
      ansible.windows.win_ping:

    - name: Ensure required directory structure exists
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ perf_root }}"
        - "{{ log_path }}"
        - "{{ csv_path }}"
        - "{{ setup_path }}"

    - name: Execute disk health check, cleanup, and file compression
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'

          $LogFile = '{{ log_path }}\Baseline_Ansible.log'
          function Write-Log ($msg) {
              Add-Content -LiteralPath $LogFile -Value "$((Get-Date).ToString('yyyy/MM/dd HH:mm:ss')) - $msg"
          }

          # 1. Evaluate Initial Free Space
          $Disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          if (-not $Disk) { throw 'Unable to query C: drive.' }
          $FreeGB = [math]::Round($Disk.FreeSpace / 1GB, 2)

          $Age = if ($FreeGB -ge {{ high_space_threshold_gb }}) {
              {{ high_space_retention_days }}
          } else {
              {{ low_space_retention_days }}
          }

          Write-Log "Initial free space: $FreeGB GB. Retention window: $Age days."

          # 2. Clean Expired Files (CSV, ZIP, LOG)
          $Cutoff = (Get-Date).AddDays(-$Age)
          foreach ($Dir in @('{{ csv_path }}', '{{ log_path }}')) {
              Get-ChildItem -LiteralPath $Dir -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.LastWriteTime -lt $Cutoff } |
                  ForEach-Object {
                      Remove-Item -LiteralPath $_.FullName -Force -ErrorAction SilentlyContinue
                      Write-Log "Removed expired artifact: $($_.FullName)"
                  }
          }

          # 3. Compress Historical CSVs
          $Today = (Get-Date).Date
          $OldCsvs = Get-ChildItem -LiteralPath '{{ csv_path }}' -Filter '*.csv' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -lt $Today }

          foreach ($File in $OldCsvs) {
              $Zip = "$($File.FullName).zip"
              if (-not (Test-Path -LiteralPath $Zip)) {
                  Compress-Archive -LiteralPath $File.FullName -DestinationPath $Zip -CompressionLevel Fastest
                  if (Test-Path -LiteralPath $Zip) {
                      Remove-Item -LiteralPath $File.FullName -Force
                      Write-Log "Compressed archive: $($File.FullName) -> $Zip"
                  }
              }
          }

          # 4. Check Post-Cleanup Capacity
          $PostDisk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $PostFreeGB = [math]::Round($PostDisk.FreeSpace / 1GB, 2)
          $CanSetup = $PostFreeGB -ge {{ minimum_free_space_gb }}

          $Ansible.Result = @{
              initial_free_gb = $FreeGB
              post_free_gb    = $PostFreeGB
              retention_days  = $Age
              can_proceed     = $CanSetup
          }
      register: maintenance_result

    - name: Fail or notify if capacity is below minimum threshold
      ansible.builtin.debug:
        msg: >-
          Disk space is critically low ({{ maintenance_result.result.post_free_gb }} GB free).
          Minimum {{ minimum_free_space_gb }} GB required. Setup aborted.
      when: not (maintenance_result.result.can_proceed | bool)

    - name: Configure baseline collector and scheduled task
      when: maintenance_result.result.can_proceed | bool
      block:
        - name: Verify setup asset presence
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              foreach ($Path in @('{{ counter_file }}', '{{ task_xml }}')) {
                  if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
                      throw "Required configuration asset missing: $Path"
                  }
              }

        - name: Configure collector and scheduled task
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              $TaskName = '{{ task_name }}'
              $CollectorName = '{{ collector_name }}'
              $LogFile = '{{ log_path }}\Baseline_Ansible.log'

              # Ensure Scheduled Task is registered
              $Task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
              if ($null -eq $Task) {
                  Register-ScheduledTask -TaskName $TaskName -Xml (Get-Content -LiteralPath '{{ task_xml }}' -Raw) -Force | Out-Null
              } else {
                  if ($Task.State -eq 'Disabled') {
                      Enable-ScheduledTask -TaskName $TaskName | Out-Null
                  }
              }

              # Check and start or reconfigure collector
              $Query = & logman query $CollectorName 2>&1
              if ($LASTEXITCODE -ne 0) {
                  $OutputPrefix = Join-Path '{{ csv_path }}' $env:COMPUTERNAME
                  & logman create counter $CollectorName -o $OutputPrefix -f csv -v mmddhhmm -cf '{{ counter_file }}' -si 60 -sc 1440
                  if ($LASTEXITCODE -ne 0) { throw "Failed to create counter collector $CollectorName" }
              }

              if (($Query | Out-String) -notmatch '(?im)^\s*Status:\s*Running') {
                  & logman start $CollectorName
                  if ($LASTEXITCODE -ne 0) { throw "Failed to start counter collector $CollectorName" }
              }

              Add-Content -LiteralPath $LogFile -Value "$((Get-Date).ToString('yyyy/MM/dd HH:mm:ss')) - Collector and task verified active."

        - name: Validate metric collection
          ansible.windows.win_powershell:
            script: |
              $LatestFile = Get-ChildItem -LiteralPath '{{ csv_path }}' -Filter '*.csv' -File |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1

              if ($null -eq $LatestFile) {
                  $Ansible.Result = @{ status = "pending" }
                  return
              }

              # Safely read shared file
              $Stream = [System.IO.File]::Open($LatestFile.FullName, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              $Reader = New-Object System.IO.StreamReader($Stream)
              $Content = $Reader.ReadToEnd()
              $Reader.Close()
              $Stream.Close()

              $Data = @($Content | ConvertFrom-Csv)
              if ($Data.Count -gt 0) {
                  $LatestRow = $Data[-1]
                  $Cols = $Data[0].PSObject.Properties.Name
                  $DiskCol = $Cols | Where-Object { $_ -match '% Free Space' } | Select-Object -First 1
                  if (-not $DiskCol) { $DiskCol = $Cols[-1] }

                  $Ansible.Result = @{
                      status        = "ok"
                      source_file   = $LatestFile.Name
                      timestamp     = [string]$LatestRow.$($Cols[0])
                      disk_free_pct = $LatestRow.$DiskCol
                  }
              } else {
                  $Ansible.Result = @{ status = "sampling" }
              }
          register: metric_status

        - name: Display summary report
          ansible.builtin.debug:
            msg:
              - "================ BASELINE SUMMARY REPORT ================"
              - "Initial Free Space : {{ maintenance_result.result.initial_free_gb }} GB"
              - "Post-Cleanup Free  : {{ maintenance_result.result.post_free_gb }} GB"
              - "Retention Days     : {{ maintenance_result.result.retention_days }}"
              - "Sampling Status    : {{ metric_status.result.status }}"
              - "Target File        : {{ metric_status.result.source_file | default('N/A') }}"
              - "Latest Free %      : {{ metric_status.result.disk_free_pct | default('N/A') }}"
              - "=========================================================="
