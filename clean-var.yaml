---
- name: /var filesystem housekeeping
  hosts: linux-test
  become: true
  gather_facts: false

  vars:
    housekeeping_dir: /var
    threshold: 65
    supported_regions:
      - GB
      - UK
      - US

    region: "{{ host_region | default('US') }}"
    log_file: /var/log/dc-tanium-housekeeping-psd-task.log
    usage_check_retries: 6
    usage_check_delay: 5

  tasks:

    # 1. Initialize report
    - name: Initialize housekeeping report
      ansible.builtin.set_fact:
        housekeeping_status: "NOT_STARTED"
        housekeeping_exit_code: 0
        cleanup_actions: []
        files_affected: 0
        usage_before: -1
        usage_after: -1
        bytes_used_before: 0
        bytes_used_after: 0
        bytes_available_before: 0
        bytes_available_after: 0
        filesystem_size_kb: 0
        space_reclaimed_kb: 0
        report_message: "Housekeeping not started"
        start_time: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S') }}"

    # 2. Validate directory
    - name: Check whether /var exists
      ansible.builtin.stat:
        path: "{{ housekeeping_dir }}"
      register: var_directory

    - name: Set missing directory result
      ansible.builtin.set_fact:
        housekeeping_status: "DIRECTORY_NOT_PRESENT"
        housekeeping_exit_code: 21
        report_message: "/var directory does not exist"
      when: not var_directory.stat.isdir | default(false)

    # 3. Validate mount point
    - name: Check /var mount point
      ansible.builtin.command:
        argv:
          - findmnt
          - -rn
          - -M
          - "{{ housekeeping_dir }}"
      register: mount_check
      changed_when: false
      failed_when: false
      when: housekeeping_exit_code == 0

    - name: Set missing mount result
      ansible.builtin.set_fact:
        housekeeping_status: "FILESYSTEM_NOT_MOUNTED"
        housekeeping_exit_code: 22
        report_message: "/var is not a separate mount point"
      when:
        - housekeeping_exit_code == 0
        - mount_check.rc != 0

    # 4. Validate region
    - name: Set unsupported region result
      ansible.builtin.set_fact:
        housekeeping_status: "UNSUPPORTED_REGION"
        housekeeping_exit_code: 23
        report_message: "Region {{ region }} is not supported"
      when:
        - housekeeping_exit_code == 0
        - region | upper not in supported_regions

    # 5. Read filesystem usage before cleanup
    - name: Read initial /var filesystem usage
      ansible.builtin.command:
        argv:
          - df
          - -Pk
          - "{{ housekeeping_dir }}"
      register: initial_df
      changed_when: false
      when: housekeeping_exit_code == 0

    - name: Store initial filesystem calculations
      ansible.builtin.set_fact:
        filesystem_size_kb: "{{ initial_df.stdout_lines[1].split()[1] | int }}"
        bytes_used_before: "{{ (initial_df.stdout_lines[1].split()[2] | int) * 1024 }}"
        bytes_available_before: "{{ (initial_df.stdout_lines[1].split()[3] | int) * 1024 }}"
        usage_before: "{{ initial_df.stdout_lines[1].split()[4] | regex_replace('%', '') | int }}"
        usage_after: "{{ initial_df.stdout_lines[1].split()[4] | regex_replace('%', '') | int }}"
      when: housekeeping_exit_code == 0

    # 6. Threshold decision
    - name: Mark housekeeping as not required
      ansible.builtin.set_fact:
        housekeeping_status: "NOT_REQUIRED"
        housekeeping_exit_code: 0
        report_message: "/var usage is at or below {{ threshold }}%"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int <= threshold

    # 7. Perform cleanup
    - name: Housekeeping when usage exceeds threshold
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > threshold
      block:

        - name: Create temporary cleanup report
          ansible.builtin.tempfile:
            state: file
            path: /var/tmp
            prefix: var-housekeeping-
          register: cleanup_report

        - name: Delete old archives, clean caches and process logs
          ansible.builtin.shell:
            cmd: |
              set -u

              report="${CLEANUP_REPORT}"

              record() {
                printf '%s\n' "$1" >> "$report"
              }

              # /var/tmp: archives older than 15 days
              if [ -d /var/tmp ]; then
                find /var/tmp -xdev -type f -mtime +15 \
                  \( -name '*.zip' -o -name '*.gz' \
                     -o -name '*.tar' -o -name '*.xz' \
                     -o -name '*.bz2' -o -name '*.tgz' \) \
                  -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  if rm -f -- "$f"; then
                    record "DELETED: $f"
                  else
                    record "ERROR_DELETING: $f"
                  fi
                done
              fi

              # /var/cache: old RPM and SQLite cache files
              if [ -d /var/cache ]; then
                find /var/cache -xdev -type f -mtime +15 \
                  \( -name '*x86_64*rpm' -o -name '*.sqlite*' \) \
                  -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  if rm -f -- "$f"; then
                    record "DELETED: $f"
                  else
                    record "ERROR_DELETING: $f"
                  fi
                done
              fi

              # Mail queue files older than 7 days
              for d in /var/spool/clientmqueue \
                       /var/spool/postfix/maildrop; do
                if [ -d "$d" ]; then
                  find "$d" -xdev -type f -mtime +7 \
                    -print0 2>/dev/null |
                  while IFS= read -r -d '' f; do
                    if rm -f -- "$f"; then
                      record "DELETED: $f"
                    else
                      record "ERROR_DELETING: $f"
                    fi
                  done
                fi
              done

              # Centrify upgrade directory
              find /var/tmp -xdev -type d \
                -name 'centrify2017.3upgrade' -prune \
                -print0 2>/dev/null |
              while IFS= read -r -d '' d; do
                if rm -rf -- "$d"; then
                  record "REMOVED_DIRECTORY: $d"
                else
                  record "ERROR_REMOVING_DIRECTORY: $d"
                fi
              done

              # Truncate mlocate.db files larger than 500000 KiB
              if [ -d /var/lib ]; then
                find /var/lib -xdev -type f -name 'mlocate.db' \
                  -size +500000k -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  if : > "$f"; then
                    record "TRUNCATED: $f"
                  else
                    record "ERROR_TRUNCATING: $f"
                  fi
                done
              fi

              # Compress eligible rotated logs
              if [ -d /var/log ]; then
                find /var/log -xdev -type f -mtime +2 \
                  -size +50000k \
                  \( -name '*messages-*' -o -name '*auth.log-*' \
                     -o -name '*secure-*' -o -name '*wtmp-*' \
                     -o -name 'messages.*' -o -name 'auth.log.*' \
                     -o -name 'secure.*' -o -name 'wtmp.*' \) \
                  -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  if gzip -- "$f"; then
                    record "COMPRESSED: $f"
                  else
                    record "ERROR_COMPRESSING: $f"
                  fi
                done

                if [ -d /var/log/sa ]; then
                  find /var/log/sa -xdev -type f -mtime +3 \
                    -name 'sa*' -size +50000k \
                    -print0 2>/dev/null |
                  while IFS= read -r -d '' f; do
                    if gzip -- "$f"; then
                      record "COMPRESSED: $f"
                    else
                      record "ERROR_COMPRESSING: $f"
                    fi
                  done
                fi
              fi

              # Remove old core files
              if [ -d /var/crash ]; then
                find /var/crash -xdev -type f -mtime +3 \
                  -name '*core*' -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  if rm -f -- "$f"; then
                    record "DELETED_CORE: $f"
                  else
                    record "ERROR_DELETING_CORE: $f"
                  fi
                done
              fi

              cat "$report"
            executable: /bin/bash
          environment:
            CLEANUP_REPORT: "{{ cleanup_report.path }}"
          register: cleanup_output
          changed_when: false

        - name: Store cleanup actions
          ansible.builtin.set_fact:
            cleanup_actions: "{{ cleanup_output.stdout_lines | default([]) }}"
            files_affected: >-
              {{
                cleanup_output.stdout_lines | default([])
                | select('match', '^(DELETED:|REMOVED_DIRECTORY:|TRUNCATED:|COMPRESSED:|DELETED_CORE:)')
                | list | length
              }}

        - name: Remove temporary cleanup report
          ansible.builtin.file:
            path: "{{ cleanup_report.path }}"
            state: absent

        # 8. Read final filesystem usage
        - name: Read filesystem usage after cleanup
          ansible.builtin.command:
            argv:
              - df
              - -Pk
              - "{{ housekeeping_dir }}"
          register: after_df
          changed_when: false
          until: after_df.stdout_lines | length >= 2
          retries: "{{ usage_check_retries }}"
          delay: "{{ usage_check_delay }}"

        - name: Store final filesystem calculations
          ansible.builtin.set_fact:
            bytes_used_after: "{{ (after_df.stdout_lines[1].split()[2] | int) * 1024 }}"
            bytes_available_after: "{{ (after_df.stdout_lines[1].split()[3] | int) * 1024 }}"
            usage_after: "{{ after_df.stdout_lines[1].split()[4] | regex_replace('%', '') | int }}"

        - name: Calculate net space reclaimed
          ansible.builtin.set_fact:
            space_reclaimed_kb: >-
              {{
                (
                  (bytes_used_before | int) -
                  (bytes_used_after | int)
                ) // 1024
              }}

        # 9. Determine final status
        - name: Set no files found result
          ansible.builtin.set_fact:
            housekeeping_status: "NO_FILES_FOUND"
            housekeeping_exit_code: 3
            report_message: "No cleanup actions succeeded; PSD attention may be required"
          when: files_affected | int == 0

        - name: Set usage still high result
          ansible.builtin.set_fact:
            housekeeping_status: "USAGE_STILL_HIGH"
            housekeeping_exit_code: 2
            report_message: "/var usage remains above {{ threshold }}%"
          when:
            - files_affected | int > 0
            - usage_after | int > threshold

        - name: Set housekeeping success result
          ansible.builtin.set_fact:
            housekeeping_status: "SUCCESS"
            housekeeping_exit_code: 1
            report_message: "Housekeeping completed; /var usage is at or below {{ threshold }}%"
          when:
            - files_affected | int > 0
            - usage_after | int <= threshold

    # 10. Final report
    - name: Display final housekeeping summary
      ansible.builtin.debug:
        msg:
          - "========== /var HOUSEKEEPING FINAL REPORT =========="
          - "Host: {{ inventory_hostname }}"
          - "Region: {{ region | upper }}"
          - "Filesystem: {{ housekeeping_dir }}"
          - "Threshold: {{ threshold }}%"
          - "Start time UTC: {{ start_time }}"
          - "Filesystem size: {{ filesystem_size_kb }} KiB"
          - "Usage before: {{ usage_before }}%"
          - "Used bytes before: {{ bytes_used_before }}"
          - "Available bytes before: {{ bytes_available_before }}"
          - "Successful actions: {{ files_affected }}"
          - "Usage after: {{ usage_after }}%"
          - "Used bytes after: {{ bytes_used_after }}"
          - "Available bytes after: {{ bytes_available_after }}"
          - "Net space reclaimed: {{ space_reclaimed_kb }} KiB"
          - "Final status: {{ housekeeping_status }}"
          - "Exit-code equivalent: {{ housekeeping_exit_code }}"
          - "Result: {{ report_message }}"
          - "===================================================="

    - name: Display cleanup action details
      ansible.builtin.debug:
        var: cleanup_actions
      when: cleanup_actions | length > 0

    - name: Append summary to housekeeping log
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: true
        mode: "0640"
        insertafter: EOF
        line: >-
          {{ start_time }} host={{ inventory_hostname }}
          region={{ region | upper }}
          usage_before={{ usage_before }}%
          usage_after={{ usage_after }}%
          successful_actions={{ files_affected }}
          reclaimed_kb={{ space_reclaimed_kb }}
          status={{ housekeeping_status }}
          exit_code={{ housekeeping_exit_code }}
          result="{{ report_message }}"
      when: var_directory.stat.isdir | default(false)
