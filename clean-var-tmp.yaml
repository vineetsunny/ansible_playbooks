# =============================================================================
# Playbook Name : clean-var-tmp.yml
# Description   : Performs automated housekeeping of the /var/tmp filesystem
#                 on Linux systems when filesystem utilization reaches 75%.
#
# Purpose       : Prevents filesystem capacity issues by deleting eligible
#                 ZIP and TAR archive files older than 15 days.
#
# Scope         : GB, UK, and US Linux servers
# Target FS     : /var/tmp
# Threshold     : 75% filesystem utilization
# File Age      : Older than 15 days
# File Types    : ZIP and TAR archives
# Log File      : /var/log/housekeeping-psd-task.log
#
# Prerequisites:
#   - Ansible connectivity to the target Linux server.
#   - Privilege escalation (become: true).
#   - Target filesystem mounted and accessible.
#   - Appropriate permissions to identify and delete eligible files.
#   - Region validation to ensure only GB, UK, and US servers are remediated.
#
# Execution     : ansible-playbook -i inventory clean-var-tmp.yml
#
# Exit Codes:
#   0  - Housekeeping not required; utilization is below the threshold.
#   1  - Housekeeping performed.
#   2  - Filesystem utilization remains unchanged after housekeeping.
#   3  - No eligible files found for housekeeping.
#   21 - Target directory not present.
#   22 - Target filesystem not mounted.
#   23 - Region not supported.
#
# Important     : Files matching the configured cleanup criteria are deleted
#                 permanently. Validate the file selection criteria and
#                 filesystem utilization before production execution.
#                 Smaller regions and HRC servers are excluded from remediation.
#
# Version       : 1.0
# =============================================================================

---
- name: Production housekeeping for /var/tmp
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: false

  vars:
    housekeeping_dir: /var/tmp
    usage_threshold: 75
    file_age_minutes: 21600  # Strictly older than 15 days
    supported_regions:
      - GB
      - UK
      - US

    housekeeping_log: /var/log/dc-tanium-housekeeping-psd-task.log
    log_prefix: Tanium-Housekeeping-PSD-Task-VAR

  tasks:
    # ---------------------------------------------------------
    # 1. Initialize all variables so skipped tasks are safe.
    # ---------------------------------------------------------
    - name: Initialize housekeeping results
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: "NOT_STARTED"
        usage_before: "N/A"
        usage_after: "N/A"
        deleted_file_count: 0
        cleanup_executed: false
        cleanup_failed: false

    - name: Ensure housekeeping log exists
      ansible.builtin.file:
        path: "{{ housekeeping_log }}"
        state: touch
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    # ---------------------------------------------------------
    # 2. Check directory.
    # Exit 21: directory missing.
    # ---------------------------------------------------------
    - name: Check housekeeping directory
      ansible.builtin.stat:
        path: "{{ housekeeping_dir }}"
      register: directory_check

    - name: Set directory missing result
      ansible.builtin.set_fact:
        housekeeping_exit_code: 21
        housekeeping_result: "DIRECTORY_NOT_PRESENT"
      when: >
        not (directory_check.stat.exists | default(false))
        or not (directory_check.stat.isdir | default(false))

    # ---------------------------------------------------------
    # 3. Check the mounted filesystem backing /var/tmp.
    # Use -T rather than -M: /var/tmp can be a directory
    # on the root filesystem and need not be a separate mount.
    # Exit 22: no mounted filesystem can be identified.
    # ---------------------------------------------------------
    - name: Identify filesystem backing housekeeping directory
      ansible.builtin.command:
        argv:
          - findmnt
          - -rn
          - -T
          - "{{ housekeeping_dir }}"
          - -o
          - TARGET
      register: mount_check
      changed_when: false
      failed_when: false
      when: housekeeping_exit_code == 0

    - name: Set filesystem not mounted result
      ansible.builtin.set_fact:
        housekeeping_exit_code: 22
        housekeeping_result: "FILESYSTEM_NOT_MOUNTED"
      when:
        - housekeeping_exit_code == 0
        - mount_check.rc | default(1) != 0
          or mount_check.stdout | default('') | trim == ''

    # ---------------------------------------------------------
    # 4. Validate region.
    # Exit 23: unsupported or missing region.
    # ---------------------------------------------------------
    - name: Validate supported region
      ansible.builtin.set_fact:
        housekeeping_exit_code: 23
        housekeeping_result: "REGION_NOT_SUPPORTED"
      when:
        - housekeeping_exit_code == 0
        - (region | default('') | upper) not in supported_regions

    # ---------------------------------------------------------
    # 5. Capture usage before cleanup.
    # ---------------------------------------------------------
    - name: Read initial filesystem usage
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ housekeeping_dir }}"
      register: initial_df
      changed_when: false
      when: housekeeping_exit_code == 0

    - name: Validate initial filesystem usage
      ansible.builtin.assert:
        that:
          - initial_df.rc == 0
          - initial_df.stdout_lines | length >= 2
          - initial_df.stdout_lines[-1].split() | length >= 5
          - initial_df.stdout_lines[-1].split()[4] is match('^[0-9]+%$')
        fail_msg: >-
          Cannot determine valid filesystem usage for
          {{ housekeeping_dir }} on {{ inventory_hostname }}.
      when: housekeeping_exit_code == 0

    - name: Save initial filesystem usage
      ansible.builtin.set_fact:
        usage_before: >-
          {{ initial_df.stdout_lines[-1].split()[4]
             | regex_replace('%', '') | int }}
      when: housekeeping_exit_code == 0

    # ---------------------------------------------------------
    # 6. Exit 0 when usage is at or below 75%.
    # ---------------------------------------------------------
    - name: Set housekeeping not required result
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: "HOUSEKEEPING_NOT_REQUIRED"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int <= usage_threshold

    # ---------------------------------------------------------
    # 7. Clean eligible files only above the threshold.
    # -xdev prevents traversal into other filesystems.
    # -mmin +21600 selects files older than 15 days.
    # -delete -print reports paths successfully deleted.
    # ---------------------------------------------------------
    - name: Delete eligible old archive files
      ansible.builtin.shell: |
        find {{ housekeeping_dir | quote }} \
          -xdev -type f -mmin +{{ file_age_minutes | int }} \
          \( \
            -name '*.zip' -o \
            -name '*.gz' -o \
            -name '*.tar' -o \
            -name '*.xz' -o \
            -name '*.XZ' -o \
            -name '*.bz2' -o \
            -name '*.tgz' \
          \) -delete -print
      args:
        executable: /bin/bash
      register: cleanup_output
      changed_when: >
        cleanup_output.stdout | default('') | length > 0
      failed_when: false
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold

    - name: Record whether cleanup ran
      ansible.builtin.set_fact:
        cleanup_executed: true
      when:
        - cleanup_output is defined
        - cleanup_output.rc is defined

    - name: Count deleted files
      ansible.builtin.set_fact:
        deleted_file_count: >-
          {{ cleanup_output.stdout_lines | default([]) | length }}
      when:
        - cleanup_output is defined
        - cleanup_output.rc is defined
        - cleanup_output.rc == 0

    - name: Record cleanup command failure
      ansible.builtin.set_fact:
        cleanup_failed: true
        housekeeping_result: "CLEANUP_COMMAND_FAILED"
      when:
        - cleanup_output is defined
        - cleanup_output.rc is defined
        - cleanup_output.rc != 0

    # ---------------------------------------------------------
    # 8. Recheck usage if cleanup was attempted.
    # ---------------------------------------------------------
    - name: Read final filesystem usage
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ housekeeping_dir }}"
      register: final_df
      changed_when: false
      when: cleanup_executed

    - name: Validate final filesystem usage
      ansible.builtin.assert:
        that:
          - final_df.rc == 0
          - final_df.stdout_lines | length >= 2
          - final_df.stdout_lines[-1].split() | length >= 5
          - final_df.stdout_lines[-1].split()[4] is match('^[0-9]+%$')
        fail_msg: >-
          Unable to verify filesystem usage after cleanup on
          {{ inventory_hostname }}.
      when: cleanup_executed

    - name: Save final filesystem usage
      ansible.builtin.set_fact:
        usage_after: >-
          {{ final_df.stdout_lines[-1].split()[4]
             | regex_replace('%', '') | int }}
      when: cleanup_executed

    # ---------------------------------------------------------
    # 9. Assign original result codes.
    # Exit 3: no files deleted/found.
    # Exit 2: usage remains above threshold.
    # Exit 1: cleanup performed and usage is at/below threshold.
    # ---------------------------------------------------------
    - name: Set no files found result
      ansible.builtin.set_fact:
        housekeeping_exit_code: 3
        housekeeping_result: "NO_FILES_FOUND"
      when:
        - cleanup_executed
        - not cleanup_failed
        - deleted_file_count | int == 0

    - name: Set successful cleanup result
      ansible.builtin.set_fact:
        housekeeping_exit_code: >-
          {{ 2 if (usage_after | int > usage_threshold) else 1 }}
        housekeeping_result: >-
          {{ 'USAGE_STILL_HIGH'
             if (usage_after | int > usage_threshold)
             else 'HOUSEKEEPING_PERFORMED' }}
      when:
        - cleanup_executed
        - not cleanup_failed
        - deleted_file_count | int > 0

    # ---------------------------------------------------------
    # 10. Write the report. All fields have safe defaults.
    # ---------------------------------------------------------
    - name: Append housekeeping report to server log
      ansible.builtin.shell: |
        {
          printf '%s %s Host=%s Region=%s Directory=%s Result=%s ExitCode=%s\n' \
            "$(date '+%b %d %T')" \
            {{ log_prefix | quote }} \
            {{ inventory_hostname | quote }} \
            {{ (region | default('UNKNOWN') | upper) | quote }} \
            {{ housekeeping_dir | quote }} \
            {{ housekeeping_result | quote }} \
            {{ housekeeping_exit_code | string | quote }}

          printf 'UsageBefore=%s%%\n' {{ usage_before | string | quote }}
          printf 'UsageAfter=%s%%\n' {{ usage_after | string | quote }}
          printf 'FilesDeleted=%s\n' {{ deleted_file_count | string | quote }}

          {% if cleanup_output is defined and cleanup_output.rc is defined %}
          printf 'CleanupCommandExitStatus=%s\n' \
            {{ cleanup_output.rc | string | quote }}

          {% if cleanup_output.stdout | default('') | length > 0 %}
          printf '%s\n' 'Deleted file paths:'
          printf '%s\n' {{ cleanup_output.stdout | quote }}
          {% endif %}

          {% if cleanup_output.stderr | default('') | length > 0 %}
          printf '%s\n' 'Cleanup error details:'
          printf '%s\n' {{ cleanup_output.stderr | quote }}
          {% endif %}
          {% endif %}

          printf '%s\n' '----------------------------------------'
        } >> {{ housekeeping_log | quote }}
      args:
        executable: /bin/bash
      changed_when: false

    # ---------------------------------------------------------
    # 11. Display final results.
    # ---------------------------------------------------------
    - name: Display housekeeping summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Region: {{ region | default('UNKNOWN') | upper }}"
          - "Directory: {{ housekeeping_dir }}"
          - "Usage before: {{ usage_before }}%"
          - "Usage after: {{ usage_after }}%"
          - "Files deleted: {{ deleted_file_count }}"
          - "Result: {{ housekeeping_result }}"
          - "Housekeeping exit code: {{ housekeeping_exit_code }}"
          - "Log: {{ housekeeping_log }}"

    # Fail only on a genuine cleanup command error.
    # Expected housekeeping outcomes do not fail the AAP job.
    - name: Report cleanup command failure
      ansible.builtin.fail:
        msg: >-
          Cleanup command failed on {{ inventory_hostname }}.
          Check {{ housekeeping_log }} and the cleanup error output.
      when: cleanup_failed
