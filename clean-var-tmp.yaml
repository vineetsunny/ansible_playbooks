---
- name: Clean /var/tmp Filesystem Housekeeping
  hosts: linux-test
  become: true
  gather_facts: true

  vars:
    target_dir: "/var/tmp"
    threshold_percent: 75
    file_age_days: 15
    log_file: "/var/log/housekeeping-psd-task.log"
    allowed_regions:
      - GB
      - UK
      - US

  tasks:
    - name: Ensure log file exists with proper header
      ansible.builtin.file:
        path: "{{ log_file }}"
        state: touch
        owner: root
        group: root
        mode: '0644'

    # -------------------------------------------------------------------------
    # Pre-checks & Validation
    # -------------------------------------------------------------------------
    - name: "Validate server region (Allowed: GB, UK, US)"
      ansible.builtin.assert:
        that:
          - server_region is defined
          - server_region | upper in allowed_regions
        fail_msg: "Exit Code 23: Region '{{ server_region | default('UNDEFINED') }}' is not supported for housekeeping."
      ignore_errors: true
      register: region_check

    - name: Log region check failure and abort
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [ERROR] Exit Code 23: Region check failed for server region '{{ server_region | default('UNDEFINED') }}'."
      when: region_check.failed | default(false)

    - name: End play if region check failed (Exit 23)
      ansible.builtin.meta: end_host
      when: region_check.failed | default(false)

    - name: Check if /var/tmp exists
      ansible.builtin.stat:
        path: "{{ target_dir }}"
      register: target_dir_stat

    - name: Log missing target directory error and abort (Exit 21)
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [ERROR] Exit Code 21: Target directory {{ target_dir }} does not exist."
      when: not target_dir_stat.stat.exists

    - name: End play if target directory does not exist (Exit 21)
      ansible.builtin.meta: end_host
      when: not target_dir_stat.stat.exists

    - name: Verify target mount point is mounted
      ansible.builtin.set_fact:
        target_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', target_dir) | list }}"

    - name: Log unmounted target filesystem error and abort (Exit 22)
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [ERROR] Exit Code 22: Target filesystem {{ target_dir }} is not mounted."
      when: target_mount | length == 0

    - name: End play if target filesystem not mounted (Exit 22)
      ansible.builtin.meta: end_host
      when: target_mount | length == 0

    # -------------------------------------------------------------------------
    # Capacity Check & Housekeeping Execution
    # -------------------------------------------------------------------------
    - name: Calculate initial filesystem utilization percentage
      ansible.builtin.set_fact:
        initial_usage_percent: "{{ ((1 - (target_mount[0].size_available / target_mount[0].size_total)) * 100) | round(1, 'common') }}"

    - name: Log initial utilization status
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [INFO] Initial utilization of {{ target_dir }}: {{ initial_usage_percent }}% (Threshold: {{ threshold_percent }}%)."

    - name: Check if usage is below threshold (Exit 0)
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [SUCCESS] Exit Code 0: Utilization ({{ initial_usage_percent }}%) is below threshold ({{ threshold_percent }}%). Housekeeping not required."
      when: initial_usage_percent | float < threshold_percent | float

    - name: End play if utilization is below threshold (Exit 0)
      ansible.builtin.meta: end_host
      when: initial_usage_percent | float < threshold_percent | float

    - name: Find eligible ZIP and TAR archive files older than 15 days
      ansible.builtin.find:
        paths: "{{ target_dir }}"
        age: "{{ file_age_days }}d"
        patterns: "*.zip,*.tar,*.tar.gz,*.tgz,*.tar.bz2,*.tar.xz"
        file_type: file
        recurse: true
      register: eligible_files

    - name: Log no eligible files found (Exit 3)
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [WARNING] Exit Code 3: Usage is {{ initial_usage_percent }}%, but no eligible .zip/.tar files older than {{ file_age_days }} days were found."
      when: eligible_files.matched == 0

    - name: End play if no eligible files found (Exit 3)
      ansible.builtin.meta: end_host
      when: eligible_files.matched == 0

    # -------------------------------------------------------------------------
    # Cleanup & Verification
    # -------------------------------------------------------------------------
    - name: Remove eligible ZIP and TAR files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ eligible_files.files }}"

    - name: Re-gather mount facts to check updated space
      ansible.builtin.setup:
        filter: "ansible_mounts"

    - name: Calculate final filesystem utilization percentage
      ansible.builtin.set_fact:
        final_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', target_dir) | list }}"
        final_usage_percent: "{{ ((1 - ((ansible_mounts | selectattr('mount', 'equalto', target_dir) | list)[0].size_available / (ansible_mounts | selectattr('mount', 'equalto', target_dir) | list)[0].size_total)) * 100) | round(1, 'common') }}"

    - name: Log housekeeping result when capacity freed (Exit 1)
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [SUCCESS] Exit Code 1: Housekeeping performed. Deleted {{ eligible_files.matched }} file(s). Usage dropped from {{ initial_usage_percent }}% to {{ final_usage_percent }}%."
      when: final_usage_percent | float < initial_usage_percent | float

    - name: Log housekeeping result when capacity unchanged (Exit 2)
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} [WARNING] Exit Code 2: Deleted {{ eligible_files.matched }} file(s), but filesystem utilization remains unchanged at {{ final_usage_percent }}%."
      when: final_usage_percent | float >= initial_usage_percent | float
