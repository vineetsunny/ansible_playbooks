---
- name: Housekeep /opt file system on Linux VMs
  hosts: linux-test
  gather_facts: true
  vars:
    target_fs: "/opt"
    threshold: 75
    log_file: "/var/log/dc-tanium-housekeeping-psd-task.log"
    find_file_list: "/var/tmp/findfiles.txt"

  tasks:
    - name: Create or clear housekeeping log file
      ansible.builtin.file:
        path: "{{ log_file }}"
        state: touch
        mode: '0644'

    - name: Check if /opt directory exists
      ansible.builtin.stat:
        path: "{{ target_fs }}"
      register: opt_stat

    - name: Exit 21 - Directory /opt not present
      ansible.builtin.fail:
        msg: "EXIT 21: Directory {{ target_fs }} not present."
      when: not opt_stat.stat.exists or not opt_stat.stat.isdir

    - name: Verify if /opt is a mounted file system
      ansible.builtin.set_fact:
        is_mounted: "{{ ansible_mounts | selectattr('mount', 'equalto', target_fs) | list | length > 0 }}"

    - name: Exit 22 - File system not mounted
      ansible.builtin.fail:
        msg: "EXIT 22: File system {{ target_fs }} is not mounted."
      when: not is_mounted

    - name: Get current disk usage percentage for /opt
      ansible.builtin.set_fact:
        initial_usage: "{{ (ansible_mounts | selectattr('mount', 'equalto', target_fs) | first).size_available }}"
        total_size: "{{ (ansible_mounts | selectattr('mount', 'equalto', target_fs) | first).size_total }}"

    - name: Calculate usage percentage
      ansible.builtin.set_fact:
        usage_pct: "{{ (((total_size | float - initial_usage | float) / total_size | float) * 100) | round(1, 'common') }}"

    - name: Log current disk space
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ lookup('pipe', 'date +\"%b %d %T\"') }} - Current usage on {{ target_fs }} is {{ usage_pct }}%"

    - name: Exit 0 - Under threshold (Housekeeping Not Required)
      ansible.builtin.meta: end_host
      when: usage_pct | float < threshold | float

    - name: Find candidate files for cleanup in target subdirectories
      ansible.builtin.shell: |
        set -o pipefail
        > {{ find_file_list }}
        # Patrol logs/temp older than 7 days
        [ -d /opt/patrol ] && find /opt/patrol -type f \( -name "*.log" -o -name "*.tmp" \) -mtime +7 >> {{ find_file_list }}
        # Control-M log files older than 14 days
        [ -d /opt/controlm ] && find /opt/controlm -type f \( -name "*.log" -o -name "sysout*" \) -mtime +14 >> {{ find_file_list }}
        # NetBackup logs
        for dir in nbu NBU82; do
          [ -d /opt/$dir ] && find /opt/$dir -type f -name "*.log" -mtime +7 >> {{ find_file_list }}
        done
        # WAS Support logs & trc
        [ -d /opt/IBM ] && find /opt/IBM -type f \( -name "*.log" -o -name "*.trc" \) -mtime +7 >> {{ find_file_list }}
        # VCS Debuginfo
        for dir in VRTSvxvm VRTSaslapm; do
          [ -d /opt/$dir ] && find /opt/$dir -type f -name "*.debug*" -mtime +7 >> {{ find_file_list }}
        done
        cat {{ find_file_list }}
      args:
        executable: /bin/bash
      register: found_files
      changed_when: false

    - name: Exit 3 - No Files Found with Criteria
      ansible.builtin.fail:
        msg: "EXIT 3: No files found matching cleanup criteria."
      when: found_files.stdout_lines | length == 0

    - name: Compress/Zip large logs (>50MB) found in criteria list
      ansible.builtin.shell: |
        while read -r file; do
          if [ -f "$file" ] && [ $(stat -c%s "$file") -gt 52428800 ] && [[ "$file" != *.gz ]]; then
            gzip "$file" && echo "$(date +"%b %d %T") - Zipped $file" >> {{ log_file }}
          fi
        done < {{ find_file_list }}
      args:
        executable: /bin/bash

    - name: Delete files older than threshold
      ansible.builtin.shell: |
        while read -r file; do
          if [ -f "$file" ]; then
            rm -f "$file" && echo "$(date +"%b %d %T") - Deleted $file" >> {{ log_file }}
          fi
        done < {{ find_file_list }}
      args:
        executable: /bin/bash

    - name: Re-gather facts to recalculate post-cleanup space
      ansible.builtin.setup:
        filter:
          - ansible_mounts

    - name: Get final disk space values
      ansible.builtin.set_fact:
        final_usage: >-
          {{ (ansible_mounts
              | selectattr('mount', 'equalto', target_fs)
              | first).size_available }}
        final_total_size: >-
          {{ (ansible_mounts
              | selectattr('mount', 'equalto', target_fs)
              | first).size_total }}

    - name: Calculate final disk space percentage
      ansible.builtin.set_fact:
        final_usage_pct: >-
          {{ (((final_total_size | float -
                final_usage | float) /
                final_total_size | float) * 100)
             | round(1, 'common') }}

    - name: Log cleanup results
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        line: "{{ lookup('pipe', 'date +\"%b %d %T\"') }} - Final usage on {{ target_fs }} is {{ final_usage_pct }}%"

    - name: Exit 2 - Disk usage unchanged after housekeeping
      ansible.builtin.fail:
        msg: "EXIT 2: Still same after housekeeping (Usage was {{ usage_pct }}%, now {{ final_usage_pct }}%)."
      when: final_usage_pct | float >= usage_pct | float

    - name: Exit 1 - Housekeeping performed successfully
      ansible.builtin.debug:
        msg: "EXIT 1: Housekeeping successfully performed. Usage dropped from {{ usage_pct }}% to {{ final_usage_pct }}%."
