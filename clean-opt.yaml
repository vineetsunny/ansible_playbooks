# =============================================================================
# Playbook Name : clean-opt.yml
# Description   : Performs automated housekeeping of the /opt filesystem on
#                 Linux systems when filesystem utilization reaches 75%.
#
# Purpose       : Helps prevent filesystem capacity issues by deleting or
#                 compressing eligible files based on retention periods
#                 defined by the respective support teams.
#
# Scope         : Linux servers
# Target FS     : /opt
# Threshold     : 75% filesystem utilization
# File Age      : Based on retention periods provided by the respective teams
# File Sources  : Patrol, Control-M, Storage NetBackup, WAS Support, and
#                 VCS debuginfo
# Action        : Delete or compress eligible files according to the
#                 configured housekeeping criteria
# Log File      : /var/log/housekeeping-psd-task.log
#
# Prerequisites:
#   - Ansible connectivity to the target Linux server.
#   - Privilege escalation (become: true).
#   - Target filesystem mounted and accessible.
#   - Appropriate permissions to identify, delete, or compress eligible files.
#   - Retention periods and file selection criteria defined by the
#     respective support teams.
#
# Execution : ansible-playbook -i inventory clean-opt.yml
#
# Exit Codes:
#   0  - Housekeeping not required; utilization is below the threshold.
#   1  - Housekeeping performed.
#   2  - Filesystem utilization remains unchanged after housekeeping.
#   3  - No eligible files found for housekeeping.
#   21 - Target directory not present.
#   22 - Target filesystem not mounted.
#
#
# Version       : 1.0
# =============================================================================
---
- name: Housekeep /opt filesystem on Linux VMs
  hosts: 
  become: true
  gather_facts: true

  vars:
    target_fs: "/opt"
    threshold: 75

    log_file: "/var/log/housekeeping-psd-task.log"
    find_file_list: "/var/tmp/findfiles.txt"

    # Set false for discovery/reporting only.
    housekeeping_enabled: true

    # Final execution result and exit code are reported per host.
    housekeeping_exit_code: 0
    housekeeping_exit_message: ""

    # Keep NetBackup directories excluded from deletion.
    enable_netbackup_cleanup: false

    # If fuser is unavailable, do not modify candidate files.
    check_file_usage: true

    patrol_age_days: 1
    controlm_age_days: 3
    was_archive_age_days: 7
    was_log_age_days: 1
    vcs_debug_age_days: 30

    patrol_search_paths:
      - "/opt/patrol/PATROL/log"
      - "/opt/patrol/PATROL/log/history/{{ ansible_hostname }}/3300"
      - "/opt/patrol/PATROL/log/history/{{ ansible_hostname }}/3399"

    vcs_debug_paths:
      - "/opt/VRTSvxvm/debuginfo"
      - "/opt/VRTSaslapm/debuginfo"

  tasks:
    - name: Ensure report and log directories are available
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "/var/tmp"
        - "/var/log"

    - name: Check that target directory exists
      ansible.builtin.stat:
        path: "{{ target_fs }}"
      register: target_fs_stat

    - name: Report missing target directory
      ansible.builtin.debug:
        msg:
          - "Execution result: Target directory not present."
          - "Exit code: 21"
      when: not target_fs_stat.stat.exists

    - name: Stop if target directory is missing
      ansible.builtin.fail:
        msg: "HOUSEKEEPING_EXIT_CODE=21: Target directory not present: {{ target_fs }}"
      when: not target_fs_stat.stat.exists

    - name: Check target filesystem mount
      ansible.builtin.command:
        argv:
          - findmnt
          - --mountpoint
          - "{{ target_fs }}"
      register: target_mount_check
      changed_when: false
      failed_when: false

    - name: Report target filesystem is not mounted
      ansible.builtin.debug:
        msg:
          - "Execution result: Target filesystem not mounted."
          - "Exit code: 22"
      when: target_mount_check.rc != 0

    - name: Stop if target filesystem is not mounted
      ansible.builtin.fail:
        msg: "HOUSEKEEPING_EXIT_CODE=22: Target filesystem not mounted: {{ target_fs }}"
      when: target_mount_check.rc != 0

    - name: Get initial filesystem usage
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ target_fs }}"
      register: df_before
      changed_when: false

    - name: Set initial filesystem usage percentage
      ansible.builtin.set_fact:
        usage_before: >-
          {{
            df_before.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}

    - name: Initialize candidate lists
      ansible.builtin.set_fact:
        housekeeping_candidates: []
        housekeeping_compress_candidates: []
        patrol_candidates: []
        was_archive_candidates: []
        controlm_candidates: []
        vcs_candidates: []
        was_log_dirs_list: []

    - name: Check optional Patrol directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ patrol_search_paths }}"
      register: patrol_path_stats
      when: usage_before | int > threshold

    - name: Build list of existing Patrol directories
      ansible.builtin.set_fact:
        existing_patrol_paths: >-
          {{
            patrol_path_stats.results
            | default([])
            | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir')
            | map(attribute='item')
            | list
          }}
      when: usage_before | int > threshold

    - name: Find eligible Patrol log files
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: false
        file_type: file
        age: "{{ patrol_age_days }}d"
        age_stamp: mtime
        patterns:
          - "*.err5.*"
          - "*.audit.*"
          - "*.PEM.*"
          - "param.hist.*"
          - "dir.*"
          - "annotate.dat.*"
      loop: "{{ existing_patrol_paths | default([]) }}"
      register: patrol_files
      when:
        - usage_before | int > threshold
        - existing_patrol_paths | default([]) | length > 0

    - name: Check Control-M directory
      ansible.builtin.stat:
        path: "/opt/controlm"
      register: controlm_dir_stat
      when: usage_before | int > threshold

    - name: Find eligible Control-M files
      ansible.builtin.find:
        paths:
          - "/opt/controlm"
        recurse: true
        depth: 4
        file_type: file
        age: "{{ controlm_age_days }}d"
        age_stamp: mtime
      register: controlm_files
      when:
        - usage_before | int > threshold
        - controlm_dir_stat.stat.isdir | default(false)

    - name: Find WAS server log directories
      ansible.builtin.find:
        paths:
          - "/opt/IBM/wlp/usr/servers"
        recurse: true
        file_type: directory
        patterns:
          - "logs"
      register: was_log_dirs
      when: usage_before | int > threshold
      failed_when: false

    - name: Save WAS log directory list
      ansible.builtin.set_fact:
        was_log_dirs_list: >-
          {{
            was_log_dirs.files
            | default([])
            | map(attribute='path')
            | list
          }}
      when: usage_before | int > threshold

    - name: Find old WAS log archives
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: false
        file_type: file
        age: "{{ was_archive_age_days }}d"
        age_stamp: mtime
        patterns:
          - "*.zip"
          - "*.gz"
          - "*.bz2"
      loop: "{{ was_log_dirs_list | default([]) }}"
      register: was_archives
      when:
        - usage_before | int > threshold
        - was_log_dirs_list | default([]) | length > 0

    - name: Find older WAS logs eligible for compression
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: false
        file_type: file
        age: "{{ was_log_age_days }}d"
        age_stamp: mtime
        patterns:
          - "messages_*.log"
          - "messages_*.log.*"
          - "console_*.log"
          - "console_*.log.*"
        excludes:
          - "*.zip"
          - "*.gz"
          - "*.bz2"
      loop: "{{ was_log_dirs_list | default([]) }}"
      register: was_compress_files
      when:
        - usage_before | int > threshold
        - was_log_dirs_list | default([]) | length > 0

    - name: Check optional VCS debug directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ vcs_debug_paths }}"
      register: vcs_path_stats
      when: usage_before | int > threshold

    - name: Build list of existing VCS debug directories
      ansible.builtin.set_fact:
        existing_vcs_paths: >-
          {{
            vcs_path_stats.results
            | default([])
            | selectattr('stat.isdir', 'defined')
            | selectattr('stat.isdir')
            | map(attribute='item')
            | list
          }}
      when: usage_before | int > threshold

    - name: Find old VCS debug files
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: true
        file_type: file
        age: "{{ vcs_debug_age_days }}d"
        age_stamp: mtime
      loop: "{{ existing_vcs_paths | default([]) }}"
      register: vcs_files
      when:
        - usage_before | int > threshold
        - existing_vcs_paths | default([]) | length > 0

    - name: Build housekeeping candidate lists
      ansible.builtin.set_fact:
        patrol_candidates: >-
          {{
            patrol_files.results | default([])
            | selectattr('files', 'defined')
            | map(attribute='files') | flatten | list
          }}
        was_archive_candidates: >-
          {{
            was_archives.results | default([])
            | selectattr('files', 'defined')
            | map(attribute='files') | flatten | list
          }}
        controlm_candidates: >-
          {{ controlm_files.files | default([]) }}
        vcs_candidates: >-
          {{
            vcs_files.results | default([])
            | selectattr('files', 'defined')
            | map(attribute='files') | flatten | list
          }}
        housekeeping_compress_candidates: >-
          {{
            was_compress_files.results | default([])
            | selectattr('files', 'defined')
            | map(attribute='files') | flatten | list
          }}
      when: usage_before | int > threshold

    - name: Combine deletion candidates
      ansible.builtin.set_fact:
        housekeeping_candidates: >-
          {{
            patrol_candidates
            + was_archive_candidates
            + controlm_candidates
            + vcs_candidates
          }}
      when: usage_before | int > threshold

    - name: Write housekeeping candidate report
      ansible.builtin.copy:
        dest: "{{ find_file_list }}"
        mode: "0640"
        content: |
          Filesystem: {{ target_fs }}
          Usage before: {{ usage_before }}%
          Threshold: {{ threshold }}%

          Deletion candidates:
          {% for f in housekeeping_candidates | default([]) %}
          {{ f.path }}
          {% else %}
          None
          {% endfor %}

          Compression candidates:
          {% for f in housekeeping_compress_candidates | default([]) %}
          {{ f.path }}
          {% else %}
          None
          {% endfor %}

          NetBackup directories (excluded from deletion):
          /opt/nbu
          /opt/NBU82

    - name: Report candidate discovery results
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ target_fs }}"
          - "Usage before: {{ usage_before }}%; threshold: {{ threshold }}%"
          - "Patrol candidates: {{ patrol_candidates | length }}"
          - "WAS archive candidates: {{ was_archive_candidates | length }}"
          - "Control-M candidates: {{ controlm_candidates | length }}"
          - "VCS debug candidates: {{ vcs_candidates | length }}"
          - "WAS compression candidates: {{ housekeeping_compress_candidates | length }}"
          - "Total deletion candidates: {{ housekeeping_candidates | length }}"
          - "Candidate report: {{ find_file_list }}"

    - name: Log initial usage and candidate counts
      ansible.builtin.shell: |
        printf '%s\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ) host={{ ansible_hostname }} filesystem={{ target_fs }} usage_before={{ usage_before }}% threshold={{ threshold }}%" \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ) host={{ ansible_hostname }} deletion_candidates={{ housekeeping_candidates | length }} compression_candidates={{ housekeeping_compress_candidates | length }}" \
          >> {{ log_file | quote }}
      args:
        executable: /bin/bash
      changed_when: true
      when: usage_before | int > threshold

    - name: Stop before modifying files when housekeeping is disabled
      ansible.builtin.debug:
        msg: >-
          Discovery-only mode. No files will be deleted or compressed.
          Review {{ find_file_list }} before setting housekeeping_enabled=true.
      when:
        - usage_before | int > threshold
        - not housekeeping_enabled | bool

    - name: Warn when no eligible files were found
      ansible.builtin.debug:
        msg: >-
          /opt is above threshold, but no eligible files were found.
          Review {{ find_file_list }}, the directory paths, filename patterns,
          and file ages. No files will be modified.
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool
        - housekeeping_candidates | length == 0
        - housekeeping_compress_candidates | length == 0

    - name: Set result when no eligible files were found
      ansible.builtin.set_fact:
        housekeeping_status: "NO_ELIGIBLE_FILES"
        housekeeping_exit_code: 3
        housekeeping_exit_message: "No eligible files found for housekeeping."
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool
        - housekeeping_candidates | length == 0
        - housekeeping_compress_candidates | length == 0

    - name: Compress eligible WAS logs
      ansible.builtin.shell: |
        set -eu
        file={{ item.path | quote }}

        if [ ! -f "$file" ]; then
          echo "SKIPPED_MISSING: $file"
          exit 0
        fi

        if [ -L "$file" ]; then
          echo "SKIPPED_SYMLINK: $file"
          exit 0
        fi

        case "$file" in
          /opt/IBM/*) ;;
          *)
            echo "ERROR_INVALID_PATH: $file"
            exit 1
            ;;
        esac

        {% if check_file_usage | bool %}
        if ! command -v fuser >/dev/null 2>&1; then
          echo "SKIPPED_FUSER_UNAVAILABLE: $file"
          exit 0
        fi

        if fuser "$file" >/dev/null 2>&1; then
          echo "SKIPPED_IN_USE: $file"
          exit 0
        fi
        {% endif %}

        if ! command -v timeout >/dev/null 2>&1; then
          echo "ERROR: timeout command is unavailable"
          exit 1
        fi
        
        archive="${file}.gz"
        
        if [ -e "$archive" ]; then
          echo "SKIPPED_ARCHIVE_EXISTS: $archive"
          exit 0
        fi

        echo "START_COMPRESS: $file"

        if timeout 300 gzip -- "$file" </dev/null; then
          echo "COMPRESSED: $file"
        else
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "ERROR_TIMEOUT: $file"
          else
            echo "ERROR_COMPRESS: $file (rc=$rc)"
          fi
          exit "$rc"
        fi
      args:
        executable: /bin/bash
      loop: "{{ housekeeping_compress_candidates }}"
      loop_control:
        label: "{{ item.path }}"
      register: compress_results
      changed_when: "'COMPRESSED:' in (stdout | default(''))"
      failed_when: (rc | default(0) | int) != 0
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool
        - housekeeping_compress_candidates | length > 0

    - name: Remove eligible old files
      ansible.builtin.shell: |
        set -eu
        file={{ item.path | quote }}

        if [ ! -f "$file" ]; then
          echo "SKIPPED_MISSING: $file"
          exit 0
        fi

        if [ -L "$file" ]; then
          echo "SKIPPED_SYMLINK: $file"
          exit 0
        fi

        case "$file" in
          /opt/patrol/PATROL/log/*|/opt/controlm/*|/opt/IBM/*|/opt/VRTSvxvm/*|/opt/VRTSaslapm/*) ;;
          *)
            echo "ERROR_INVALID_PATH: $file"
            exit 1
            ;;
        esac

        {% if check_file_usage | bool %}
        if ! command -v fuser >/dev/null 2>&1; then
          echo "SKIPPED_FUSER_UNAVAILABLE: $file"
          exit 0
        fi

        if fuser "$file" >/dev/null 2>&1; then
          echo "SKIPPED_IN_USE: $file"
          exit 0
        fi
        {% endif %}

        rm -- "$file"
        echo "DELETED: $file"
      args:
        executable: /bin/bash
      loop: "{{ housekeeping_candidates }}"
      loop_control:
        label: "{{ item.path }}"
      register: delete_results
      changed_when: "'DELETED:' in (stdout | default(''))"
      failed_when: (rc | default(0) | int) != 0
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool
        - housekeeping_candidates | length > 0

    - name: Log individual deletion results
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: true
        mode: "0640"
        insertafter: EOF
        line: "{{ ansible_date_time.iso8601 }} host={{ ansible_hostname }} {{ item.stdout | default('NO_OUTPUT') | replace('\n', ' ') }}"
      loop: "{{ delete_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | default('unknown') }}"
      when:
         - housekeeping_enabled | bool
         - delete_results.results is defined
         
    - name: Log compression and deletion outcomes
      ansible.builtin.shell: |
        echo "Housekeeping actions completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> {{ log_file | quote }}
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool
        - (compress_results.results | default([]) | length > 0) or
          (delete_results.results | default([]) | length > 0)

    - name: Get final filesystem usage
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ target_fs }}"
      register: df_after
      changed_when: false
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool

    - name: Set final filesystem usage percentage
      ansible.builtin.set_fact:
        usage_after: >-
          {{
            df_after.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool

    - name: Determine final housekeeping status and exit code
      ansible.builtin.set_fact:
        housekeeping_status: >-
          {{
            'NO_ELIGIBLE_FILES'
            if (
              housekeeping_candidates | length == 0
              and housekeeping_compress_candidates | length == 0
            )
            else (
              'FILESYSTEM_UTILIZATION_UNCHANGED'
              if usage_after | int == usage_before | int
              else 'HOUSEKEEPING_PERFORMED'
            )
          }}
        housekeeping_exit_code: >-
          {{
            3
            if (
              housekeeping_candidates | length == 0
              and housekeeping_compress_candidates | length == 0
            )
            else (
              2
              if usage_after | int == usage_before | int
              else 1
            )
          }}
        housekeeping_exit_message: >-
          {{
            'No eligible files found for housekeeping.'
            if (
              housekeeping_candidates | length == 0
              and housekeeping_compress_candidates | length == 0
            )
            else (
              'Filesystem utilization remains unchanged after housekeeping.'
              if usage_after | int == usage_before | int
              else 'Housekeeping performed.'
            )
          }}
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool

    - name: Log final filesystem usage and status
      ansible.builtin.shell: |
        printf '%s host=%s usage_before=%s%% usage_after=%s%% threshold=%s%% result=%s\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          {{ ansible_hostname | quote }} \
          {{ usage_before | string | quote }} \
          {{ usage_after | string | quote }} \
          {{ threshold | string | quote }} \
          {{ housekeeping_status | quote }} \
          >> {{ log_file | quote }}
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool

    - name: Report final result
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ target_fs }}"
          - "Usage before: {{ usage_before }}%"
          - "Usage after: {{ usage_after }}%"
          - "Threshold: {{ threshold }}%"
          - "Result: {{ housekeeping_status }}"
          - "Execution result: {{ housekeeping_exit_message }}"
          - "Exit code: {{ housekeeping_exit_code }}"
          - "Candidate report: {{ find_file_list }}"
          - "Execution log: {{ log_file }}"
      when:
        - usage_before | int > threshold
        - housekeeping_enabled | bool

    - name: Report that housekeeping is not required
      ansible.builtin.debug:
        msg: >-
          {{ target_fs }} usage is {{ usage_before }}%, which does not exceed
          the {{ threshold }}% threshold. No housekeeping was performed.
      when: usage_before | int <= threshold
