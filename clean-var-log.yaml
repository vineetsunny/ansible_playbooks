# =============================================================================
# Playbook Name : clean-var-log.yml
# Description   : Performs automated housekeeping of the /var filesystem on
#                 Linux systems when filesystem utilization reaches 65%.
#
# Purpose       : Helps prevent filesystem capacity issues by compressing
#                 eligible log files under /var/log that are larger than
#                 50 MB and older than 2 days.
#
# Scope         : GB, UK, and US Linux servers
# Target FS     : /var
# Target Dir    : /var/log
# Threshold     : 65% filesystem utilization
# File Size     : Larger than 50 MB
# File Age      : Older than 2 days
# Action        : Compress eligible log files to reduce disk usage
# Log File      : /var/log/housekeeping-psd-task.log
#
# Prerequisites:
#   - Ansible connectivity to the target Linux server.
#   - Privilege escalation (become: true).
#   - Target filesystem mounted and accessible.
#   - Appropriate permissions to read and compress eligible log files.
#   - Sufficient disk space and permissions to create compressed files.
#   - Region validation to ensure only GB, UK, and US servers are remediated.
#
# Execution     : ansible-playbook -i inventory clean-var-log.yml
#
# Exit Codes:
#   0  - Housekeeping not required; utilization is below the threshold.
#   1  - Housekeeping performed.
#   2  - Filesystem utilization remains unchanged after housekeeping.
#   3  - No eligible files found for housekeeping.
#   21 - Target directory not present.
#   22 - Target filesystem not mounted.
#   23 - Region not supported.
#
# Version       : 1.0
# =============================================================================

---
- name: Clean-var-log housekeeping
  hosts: all
  become: true
  gather_facts: true

  vars:
    housekeeping_dir: /var/log
    filesystem_path: /var/log
    housekeeping_threshold: 65
    housekeeping_log: /var/log/dc-tanium-housekeeping-psd-task.log
    housekeeping_tag: Tanium-Housekeeping-PSD-Task-VAR-LOG

    # Compression timeout settings
    compression_timeout_seconds: 600
    compression_async_timeout: 660

  tasks:

    - name: Initialize housekeeping result
      ansible.builtin.set_fact:
        cleanup_required: false
        usage_before_pct: 0
        usage_after_pct: 0
        eligible_files: []
        compression_failed_files: []
        housekeeping_result: INITIALIZED
        housekeeping_exit_code: 0

    - name: Check whether housekeeping directory exists
      ansible.builtin.stat:
        path: "{{ housekeeping_dir }}"
      register: housekeeping_dir_stat

    - name: Stop if housekeeping directory does not exist
      ansible.builtin.fail:
        msg: "Housekeeping directory {{ housekeeping_dir }} does not exist."
      when: not housekeeping_dir_stat.stat.exists

    - name: Get initial filesystem utilization
      ansible.builtin.command:
        argv:
          - df
          - -h
          - -P
          - "{{ filesystem_path }}"
      register: var_log_df_before
      changed_when: false

    - name: Display initial filesystem utilization
      ansible.builtin.debug:
        msg: "{{ var_log_df_before.stdout }}"

    - name: Record initial filesystem utilization
      ansible.builtin.set_fact:
        filesystem_name: "{{ var_log_df_before.stdout_lines[1].split()[0] }}"
        filesystem_used_before: "{{ var_log_df_before.stdout_lines[1].split()[2] }}"
        filesystem_available_before: "{{ var_log_df_before.stdout_lines[1].split()[3] }}"
        usage_before_pct: >-
          {{
            var_log_df_before.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}

    - name: Determine whether housekeeping is required
      ansible.builtin.set_fact:
        cleanup_required: >-
          {{
            (usage_before_pct | int) >
            (housekeeping_threshold | int)
          }}

    - name: Display housekeeping decision
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ filesystem_name }}"
          - "Mount utilization before cleanup: {{ usage_before_pct }}%"
          - "Configured threshold: {{ housekeeping_threshold }}%"
          - "Housekeeping required: {{ cleanup_required }}"

    - name: Find eligible rotated log files
      ansible.builtin.find:
        paths: "{{ housekeeping_dir }}"
        patterns:
          - "messages-*"
          - "auth.log-*"
          - "secure-*"
          - "wtmp-*"
          - "messages.*"
          - "auth.log.*"
          - "secure.*"
          - "wtmp.*"
        age: 2d
        age_stamp: mtime
        size: 50m
        recurse: false
        file_type: file
      register: rotated_log_files
      when: cleanup_required | bool

    - name: Check whether /var/log/sa exists
      ansible.builtin.stat:
        path: "{{ housekeeping_dir }}/sa"
      register: sa_directory
      when: cleanup_required | bool

    - name: Find eligible system activity files
      ansible.builtin.find:
        paths: "{{ housekeeping_dir }}/sa"
        patterns:
          - "sa*"
        age: 3d
        age_stamp: mtime
        size: 50m
        recurse: false
        file_type: file
      register: sa_files
      when:
        - cleanup_required | bool
        - sa_directory.stat.exists | default(false)

    - name: Combine eligible files
      ansible.builtin.set_fact:
        eligible_files: >-
          {{
            (rotated_log_files.files | default([]))
            +
            (sa_files.files | default([]))
          }}

    - name: Display eligible files
      ansible.builtin.debug:
        msg:
          - "Eligible file count: {{ eligible_files | length }}"
          - "Files selected for compression:"
          - "{{ eligible_files | map(attribute='path') | list }}"
      when: cleanup_required | bool

    - name: Report when no eligible files are found
      ansible.builtin.debug:
        msg: >-
          No files matched the configured age, size and filename criteria.
          No files will be compressed.
      when:
        - cleanup_required | bool
        - eligible_files | length == 0

    # ---------------------------------------------------------
    # COMPRESS FILES
    # - Never overwrite an existing archive.
    # - Add _1, _2, etc. when the archive name already exists.
    # - Preserve the source until compression succeeds.
    # - Record progress and errors in the remote log.
    # ---------------------------------------------------------

    - name: Compress eligible files without overwriting archives
      ansible.builtin.shell: |
        set -u

        src={{ item.path | quote }}
        log_file={{ housekeeping_log | quote }}
        timeout_seconds={{ compression_timeout_seconds | int }}

        log_message() {
          printf '%s | %s\n' "$(date '+%F %T')" "$*" \
            | tee -a "$log_file"
        }

        log_message "START compression: $src"

        if [ ! -f "$src" ]; then
          log_message "ERROR: Source file does not exist: $src"
          exit 20
        fi

        # Create a temporary archive in the source directory.
        tmp=$(mktemp "${src}.gzip-tmp.XXXXXX") || {
          log_message "ERROR: Cannot create temporary file for $src"
          exit 21
        }

        trap 'rm -f -- "$tmp"' EXIT

        # Compress to the temporary file; keep the source intact.
        timeout --signal=TERM --kill-after=30s \
          "${timeout_seconds}s" gzip -c -- "$src" > "$tmp" 2>> "$log_file"
        gzip_rc=$?

        if [ "$gzip_rc" -ne 0 ]; then
          log_message "ERROR: gzip failed or timed out: $src; rc=$gzip_rc"
          exit "$gzip_rc"
        fi

        # Atomically claim an available destination name.
        dest="${src}.gz"
        suffix=1

        while ! ln -- "$tmp" "$dest" 2>/dev/null; do
          if [ -e "$dest" ] || [ -L "$dest" ]; then
            dest="${src}_${suffix}.gz"
            suffix=$((suffix + 1))
          else
            log_message "ERROR: Cannot create archive: $dest"
            exit 22
          fi
        done

        log_message "ARCHIVE CREATED: $dest"

        # Remove the source only after successful archive creation.
        if ! rm -- "$src"; then
          log_message "ERROR: Archive exists but source removal failed: $src"
          exit 23
        fi

        log_message "SUCCESS: $src compressed to $dest"
        exit 0
      args:
        executable: /bin/bash
      loop: "{{ eligible_files }}"
      loop_control:
        label: "{{ item.path }}"
      register: compression_result
      async: "{{ compression_async_timeout }}"
      poll: 5
      failed_when: false
      when:
        - cleanup_required | bool
        - eligible_files | length > 0

    # ---------------------------------------------------------
    # COMPRESSION ERROR REPORTING
    # ---------------------------------------------------------

    - name: Reset compression failure list
      ansible.builtin.set_fact:
        compression_failed_files: []

    - name: Identify compression failures
      ansible.builtin.set_fact:
        compression_failed_files: >-
          {{ compression_failed_files + [item.item.path | default('Unknown file')] }}
      loop: "{{ compression_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | default('Unknown file') }}"
      when: >-
        (item.rc is not defined)
        or ((item.rc | default(1) | int) != 0)
        or (item.failed | default(false) | bool)

    - name: Display detailed compression diagnostics
      ansible.builtin.debug:
        msg:
          - "File: {{ item.item.path | default('Unknown') }}"
          - "Return code: {{ item.rc | default('Not available') }}"
          - "Standard output: {{ item.stdout | default('No output') }}"
          - "Standard error: {{ item.stderr | default('See remote housekeeping log') }}"
          - "Task message: {{ item.msg | default('No additional message') }}"
      loop: "{{ compression_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | default('Unknown file') }}"

    - name: Display compression summary
      ansible.builtin.debug:
        msg:
          - "Eligible files: {{ eligible_files | length }}"
          - "Compression failures: {{ compression_failed_files | length }}"
          - "Failed files: {{ compression_failed_files }}"

    # ---------------------------------------------------------
    # POST-HOUSEKEEPING UTILIZATION CHECK
    # ---------------------------------------------------------

    - name: Flush pending filesystem writes
      ansible.builtin.command:
        argv:
          - sync
      changed_when: false
      when: cleanup_required | bool

    - name: Get filesystem utilization after housekeeping
      ansible.builtin.command:
        argv:
          - df
          - -h
          - -P
          - "{{ filesystem_path }}"
      register: var_log_df_after
      changed_when: false

    - name: Display raw final filesystem utilization
      ansible.builtin.debug:
        msg:
          - "Command: df -h -P {{ filesystem_path }}"
          - "Raw output:"
          - "{{ var_log_df_after.stdout }}"

    - name: Record final filesystem utilization
      ansible.builtin.set_fact:
        filesystem_used_after: "{{ var_log_df_after.stdout_lines[1].split()[2] }}"
        filesystem_available_after: "{{ var_log_df_after.stdout_lines[1].split()[3] }}"
        usage_after_pct: >-
          {{
            var_log_df_after.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}

    - name: Display final utilization comparison
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ filesystem_name }}"
          - "Used space before: {{ filesystem_used_before }}"
          - "Available space before: {{ filesystem_available_before }}"
          - "Initial utilization: {{ usage_before_pct }}%"
          - "Used space after: {{ filesystem_used_after }}"
          - "Available space after: {{ filesystem_available_after }}"
          - "Final utilization: {{ usage_after_pct }}%"
          - "Threshold: {{ housekeeping_threshold }}%"
          - >-
            Utilization reduction:
            {{ (usage_before_pct | int) - (usage_after_pct | int) }}
            percentage points

    - name: Determine final housekeeping result
      ansible.builtin.set_fact:
        housekeeping_result: >-
          {{
            'NO_ACTION - Utilization is within threshold'
            if not (cleanup_required | bool)
            else
            'NO_SUCCESS - No eligible files found'
            if (eligible_files | length == 0)
            else
            'NO_SUCCESS - Compression failures detected'
            if (compression_failed_files | length > 0)
            else
            'NO_SUCCESS - Utilization remains above threshold; PSD attention required'
            if (usage_after_pct | int) > (housekeeping_threshold | int)
            else
            'SUCCESS - Utilization is within threshold'
          }}
        housekeeping_exit_code: >-
          {{
            0
            if not (cleanup_required | bool)
            else
            3
            if (eligible_files | length == 0)
            else
            2
            if (compression_failed_files | length > 0)
            else
            2
            if (usage_after_pct | int) > (housekeeping_threshold | int)
            else
            1
          }}

    - name: Display final housekeeping result
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ filesystem_name }}"
          - "Initial utilization: {{ usage_before_pct }}%"
          - "Final utilization: {{ usage_after_pct }}%"
          - "Threshold: {{ housekeeping_threshold }}%"
          - "Housekeeping required: {{ cleanup_required }}"
          - "Eligible files: {{ eligible_files | length }}"
          - "Compression failures: {{ compression_failed_files | length }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"

    - name: Fail job if housekeeping did not meet the threshold
      ansible.builtin.fail:
        msg: >-
          {{ housekeeping_result }}.
          Utilization before={{ usage_before_pct }}%,
          after={{ usage_after_pct }}%,
          threshold={{ housekeeping_threshold }}%,
          exit_code={{ housekeeping_exit_code }}.
      when: housekeeping_exit_code | int == 2
