---
- name: Clean-var-log housekeeping
  hosts: all
  become: true
  gather_facts: true

  vars:
    housekeeping_dir: /var/log
    filesystem_path: /var/log
    housekeeping_threshold: 65
    housekeeping_log: /var/log/housekeeping-psd-task.log
    housekeeping_tag: Tanium-Housekeeping-PSD-Task-VAR-LOG

  tasks:

    # -------------------------------------------------------
    # 1. Initialize housekeeping variables
    # -------------------------------------------------------

    - name: Initialize housekeeping result
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: "INITIALIZED"
        housekeeping_files: []
        compression_failed_files: []
        cleanup_required: false

    # -------------------------------------------------------
    # 2. Validate /var/log directory
    # -------------------------------------------------------

    - name: Check whether /var/log directory exists
      ansible.builtin.stat:
        path: "{{ housekeeping_dir }}"
      register: var_log_stat

    - name: Report missing /var/log directory
      ansible.builtin.set_fact:
        housekeeping_exit_code: 21
        housekeeping_result: >-
          DIRECTORY_NOT_PRESENT - {{ housekeeping_dir }} does not exist
      when: not var_log_stat.stat.exists or
            not var_log_stat.stat.isdir

    - name: Display directory validation failure
      ansible.builtin.debug:
        msg:
          - "Filesystem path: {{ filesystem_path }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"
      when: housekeeping_exit_code == 21

    - name: Stop processing when directory is missing
      ansible.builtin.meta: end_host
      when: housekeeping_exit_code == 21

    # -------------------------------------------------------
    # 3. Identify the filesystem containing /var/log
    # -------------------------------------------------------

    - name: Check filesystem mount
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - TARGET
          - --target
          - "{{ filesystem_path }}"
      register: var_mount
      changed_when: false
      failed_when: false

    - name: Report filesystem check failure
      ansible.builtin.set_fact:
        housekeeping_exit_code: 22
        housekeeping_result: >-
          FILESYSTEM_CHECK_FAILED - Unable to identify
          the filesystem containing {{ filesystem_path }}
      when: var_mount.rc != 0 or
            (var_mount.stdout | trim | length == 0)

    - name: Display filesystem validation failure
      ansible.builtin.debug:
        msg:
          - "Filesystem path: {{ filesystem_path }}"
          - "Error: {{ var_mount.stderr | default('Unknown error') }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"
      when: housekeeping_exit_code == 22

    - name: Stop processing when filesystem check fails
      ansible.builtin.meta: end_host
      when: housekeeping_exit_code == 22

    - name: Display identified filesystem
      ansible.builtin.debug:
        msg: "Filesystem mount containing {{ filesystem_path }}: {{ var_mount.stdout | trim }}"

    # -------------------------------------------------------
    # 4. Collect initial filesystem utilization
    # -------------------------------------------------------

    - name: Get initial filesystem utilization
      ansible.builtin.command:
        argv:
          - df
          - -h
          - -P
          - "{{ filesystem_path }}"
      register: var_log_df_before
      changed_when: false
      failed_when: false

    - name: Report initial filesystem utilization failure
      ansible.builtin.set_fact:
        housekeeping_exit_code: 22
        housekeeping_result: >-
          FILESYSTEM_CHECK_FAILED - Unable to retrieve
          initial filesystem utilization
      when: >-
        var_log_df_before.rc != 0 or
        (var_log_df_before.stdout_lines | default([]) | length) < 2

    - name: Display initial filesystem utilization failure
      ansible.builtin.debug:
        msg:
          - "Filesystem path: {{ filesystem_path }}"
          - "Command error: {{ var_log_df_before.stderr | default('Unknown error') }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"
      when: housekeeping_exit_code == 22

    - name: Stop processing when initial utilization cannot be read
      ansible.builtin.meta: end_host
      when: housekeeping_exit_code == 22

    - name: Record initial filesystem utilization
      ansible.builtin.set_fact:
        filesystem_name: "{{ var_log_df_before.stdout_lines[1].split()[0] }}"
        filesystem_size: "{{ var_log_df_before.stdout_lines[1].split()[1] }}"
        filesystem_used: "{{ var_log_df_before.stdout_lines[1].split()[2] }}"
        filesystem_available: "{{ var_log_df_before.stdout_lines[1].split()[3] }}"
        usage_before_pct: >-
          {{
            var_log_df_before.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}
        filesystem_mount: "{{ var_log_df_before.stdout_lines[1].split()[5] }}"

    - name: Display initial filesystem utilization
      ansible.builtin.debug:
        msg:
          - "========== INITIAL FILESYSTEM UTILIZATION =========="
          - "Filesystem: {{ filesystem_name }}"
          - "Mount point: {{ filesystem_mount }}"
          - "Path checked: {{ filesystem_path }}"
          - "Total size: {{ filesystem_size }}"
          - "Used space: {{ filesystem_used }}"
          - "Available space: {{ filesystem_available }}"
          - "Current utilization: {{ usage_before_pct }}%"
          - "Configured threshold: {{ housekeeping_threshold }}%"
          - "===================================================="

    # -------------------------------------------------------
    # 5. Determine housekeeping requirement
    # -------------------------------------------------------

    - name: Determine whether housekeeping is required
      ansible.builtin.set_fact:
        cleanup_required: >-
          {{
            (usage_before_pct | int) >
            (housekeeping_threshold | int)
          }}
        housekeeping_result: >-
          {{
            'HOUSEKEEPING_REQUIRED - Filesystem utilization exceeds threshold'
            if (usage_before_pct | int) > (housekeeping_threshold | int)
            else 'HOUSEKEEPING_NOT_REQUIRED - Usage is within threshold'
          }}

    - name: Display housekeeping decision
      ansible.builtin.debug:
        msg:
          - "Usage before housekeeping: {{ usage_before_pct }}%"
          - "Configured threshold: {{ housekeeping_threshold }}%"
          - "Cleanup required: {{ cleanup_required | bool }}"
          - "Decision: {{ housekeeping_result }}"

    # -------------------------------------------------------
    # 6. Find eligible rotated system logs
    # Runs only when utilization exceeds the threshold.
    # Files must be older than 2 days and larger than 50 MB.
    # -------------------------------------------------------

    - name: Find eligible rotated system log files
      ansible.builtin.find:
        paths: "{{ housekeeping_dir }}"
        recurse: false
        file_type: file
        age: 2d
        age_stamp: mtime
        size: 50m
        patterns:
          - "messages-*"
          - "auth.log-*"
          - "secure-*"
          - "wtmp-*"
          - "messages.*"
          - "auth.log.*"
          - "secure.*"
          - "wtmp.*"
        use_regex: false
      register: rotated_logs
      when: cleanup_required | bool

    - name: Find eligible system activity files
      ansible.builtin.find:
        paths: "{{ housekeeping_dir }}/sa"
        recurse: false
        file_type: file
        age: 3d
        age_stamp: mtime
        size: 50m
        patterns:
          - "sa*"
        use_regex: false
      register: sa_logs
      failed_when: false
      when: cleanup_required | bool

    - name: Combine eligible files
      ansible.builtin.set_fact:
        housekeeping_files: >-
          {{
            (rotated_logs.files | default([]))
            +
            (sa_logs.files | default([]))
          }}
      when: cleanup_required | bool

    - name: Display eligible file count and paths
      ansible.builtin.debug:
        msg:
          - "Eligible file count: {{ housekeeping_files | length }}"
          - "Eligible files: {{ housekeeping_files | map(attribute='path') | list }}"
      when: cleanup_required | bool

    - name: Report when no eligible files are found
      ansible.builtin.set_fact:
        housekeeping_exit_code: 3
        housekeeping_result: >-
          NO_FILES_FOUND - No eligible files found;
          PSD attention required
      when:
        - cleanup_required | bool
        - housekeeping_files | length == 0

    # -------------------------------------------------------
    # 7. Compress eligible files
    # -------------------------------------------------------

    - name: Compress eligible log files
      ansible.builtin.command:
        argv:
          - gzip
          - --
          - "{{ item.path }}"
      loop: "{{ housekeeping_files }}"
      loop_control:
        label: "{{ item.path }}"
      register: compression_result
      failed_when: false
      when:
        - cleanup_required | bool
        - housekeeping_files | length > 0

    - name: Identify compression failures
      ansible.builtin.set_fact:
        compression_failed_files: >-
          {{
            (compression_result.results | default([]))
            | rejectattr('rc', 'equalto', 0)
            | map(attribute='item.path')
            | list
          }}
      when:
        - cleanup_required | bool
        - housekeeping_files | length > 0

    - name: Display compression results
      ansible.builtin.debug:
        msg:
          - "Files selected: {{ housekeeping_files | length }}"
          - "Compression failures: {{ compression_failed_files | length }}"
          - "Failed file paths: {{ compression_failed_files }}"
      when:
        - cleanup_required | bool
        - housekeeping_files | length > 0

    # -------------------------------------------------------
    # 8. Measure final filesystem utilization
    # Measure again even if housekeeping was skipped.
    # -------------------------------------------------------

    - name: Get final filesystem utilization
      ansible.builtin.command:
        argv:
          - df
          - -h
          - -P
          - "{{ filesystem_path }}"
      register: var_log_df_after
      changed_when: false
      failed_when: false

    - name: Report final filesystem utilization failure
      ansible.builtin.set_fact:
        housekeeping_exit_code: 22
        housekeeping_result: >-
          FILESYSTEM_CHECK_FAILED - Unable to retrieve
          final filesystem utilization
      when: >-
        var_log_df_after.rc != 0 or
        (var_log_df_after.stdout_lines | default([]) | length) < 2

    - name: Record final filesystem utilization
      ansible.builtin.set_fact:
        filesystem_used_after: "{{ var_log_df_after.stdout_lines[1].split()[2] }}"
        filesystem_available_after: "{{ var_log_df_after.stdout_lines[1].split()[3] }}"
        usage_after_pct: >-
          {{
            var_log_df_after.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}
      when: housekeeping_exit_code != 22

    - name: Display before and after utilization
      ansible.builtin.debug:
        msg:
          - "========== FILESYSTEM UTILIZATION SUMMARY =========="
          - "Filesystem: {{ filesystem_name }}"
          - "Mount point: {{ filesystem_mount }}"
          - "Usage before housekeeping: {{ usage_before_pct }}%"
          - "Usage after housekeeping: {{ usage_after_pct }}%"
          - "Used space after housekeeping: {{ filesystem_used_after }}"
          - "Available space after housekeeping: {{ filesystem_available_after }}"
          - "Change: {{ (usage_before_pct | int) - (usage_after_pct | int) }} percentage points"
          - "==================================================="
      when: housekeeping_exit_code != 22

    # -------------------------------------------------------
    # 9. Determine final housekeeping outcome
    # -------------------------------------------------------

    - name: Set result when housekeeping was not required
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: >-
          HOUSEKEEPING_NOT_REQUIRED - Usage is within threshold
      when:
        - not (cleanup_required | bool)
        - housekeeping_exit_code != 22

    - name: Set result when no eligible files were found
      ansible.builtin.set_fact:
        housekeeping_exit_code: 3
        housekeeping_result: >-
          NO_FILES_FOUND - No eligible files found;
          PSD attention required
      when:
        - cleanup_required | bool
        - housekeeping_files | length == 0
        - housekeeping_exit_code != 22

    - name: Set result when compression failed
      ansible.builtin.set_fact:
        housekeeping_exit_code: 2
        housekeeping_result: >-
          NO_SUCCESS - One or more files failed compression;
          PSD attention required
      when:
        - cleanup_required | bool
        - housekeeping_files | length > 0
        - compression_failed_files | length > 0
        - housekeeping_exit_code != 22

    - name: Set result when utilization remains above threshold
      ansible.builtin.set_fact:
        housekeeping_exit_code: 2
        housekeeping_result: "NO_SUCCESS - Utilization remains above threshold; PSD attention required"
      when:
        - cleanup_required | bool
        - housekeeping_files | length > 0
        - compression_failed_files | length == 0
        - usage_after_pct | int > housekeeping_threshold | int
        - housekeeping_exit_code != 22

    - name: Set result when housekeeping succeeds
      ansible.builtin.set_fact:
        housekeeping_exit_code: 1
        housekeeping_result: "SUCCESS - Housekeeping performed"
      when:
        - cleanup_required | bool
        - housekeeping_files | length > 0
        - compression_failed_files | length == 0
        - usage_after_pct | int <= housekeeping_threshold | int
        - housekeeping_exit_code != 22

    # -------------------------------------------------------
    # 10. Log final result
    # -------------------------------------------------------

    - name: Log housekeeping summary
      ansible.builtin.lineinfile:
        path: "{{ housekeeping_log }}"
        create: true
        mode: "0640"
        owner: root
        group: root
        line: >-
          {{ ansible_date_time.iso8601 }}
          {{ housekeeping_tag }}
          Filesystem={{ filesystem_path }}
          UsageBefore={{ usage_before_pct }}%
          UsageAfter={{ usage_after_pct | default('N/A') }}%
          FilesProcessed={{ housekeeping_files | length }}
          CompressionFailures={{ compression_failed_files | length }}
          Result={{ housekeeping_result }}
          ExitCode={{ housekeeping_exit_code }}
      when: housekeeping_exit_code not in [21, 22]

    # -------------------------------------------------------
    # 11. Display final result
    # -------------------------------------------------------

    - name: Display final housekeeping result
      ansible.builtin.debug:
        msg:
          - "========== HOUSEKEEPING SUMMARY ===================="
          - "Filesystem: {{ filesystem_name }}"
          - "Mount point: {{ filesystem_mount }}"
          - "Initial utilization: {{ usage_before_pct }}%"
          - "Final utilization: {{ usage_after_pct | default('N/A') }}{% if usage_after_pct is defined %}%{% endif %}"
          - "Threshold: {{ housekeeping_threshold }}%"
          - "Housekeeping required: {{ cleanup_required | bool }}"
          - "Eligible files: {{ housekeeping_files | length }}"
          - "Compression failures: {{ compression_failed_files | length }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"
          - "==================================================="

    - name: Return housekeeping outcome
      ansible.builtin.fail:
        msg: >-
          {{ housekeeping_result }}.
          Usage before={{ usage_before_pct }}%,
          usage after={{ usage_after_pct | default('N/A') }}%,
          exit code={{ housekeeping_exit_code }}.
      when: housekeeping_exit_code in [2, 21, 22]
