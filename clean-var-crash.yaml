---
- name: Housekeep /var filesystem when threshold exceeds 65%
  hosts: linux-test
  gather_facts: true
  vars:
    dir: "/var/crash"
    logfile: "/var/log/housekeeping-psd-task.log"
    threshold: 65

  tasks:
    - name: Get current date and time string
      ansible.builtin.set_fact:
        now_str: "{{ lookup('pipe', 'date \"+%b %d %T\"') }}"

    # --- Sanity Checks ---
    - name: Check if directory exists
      ansible.builtin.stat:
        path: "{{ dir }}"
      register: dir_stat

    - name: Log and exit if directory is not present
      when: not dir_stat.stat.exists or not dir_stat.stat.isdir
      block:
        - name: Log missing directory
          ansible.builtin.lineinfile:
            path: "{{ logfile }}"
            create: true
            line: "{{ now_str }} Tanium-Housekeeping-PSD-Task-VAR-LOG Directory {{ dir }} Not Present"

        - name: Fail with exit code 21
          ansible.builtin.fail:
            msg: "Directory {{ dir }} Not Present (Exit code 21)"

    - name: Check if /var mount point is present in mounts
      ansible.builtin.set_fact:
        is_mounted: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var') | list | length > 0 or ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | list | length > 0 }}"

    - name: Log and exit if mount point not present
      when: not is_mounted
      block:
        - name: Log missing mount
          ansible.builtin.lineinfile:
            path: "{{ logfile }}"
            create: true
            line: "{{ now_str }} Tanium-Housekeeping-PSD-Task-VAR-LOG Mount Point {{ dir }} Not Present"

        - name: Fail with exit code 22
          ansible.builtin.fail:
            msg: "Mount Point {{ dir }} Not Present (Exit code 22)"

    # --- Threshold Verification ---
    - name: Get current usage percentage of /var
      ansible.builtin.set_fact:
        initial_usage: "{{ (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var') | list | default(ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')) | first).size_available | default(0) }}"
        total_size: "{{ (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var') | list | default(ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')) | first).size_total | default(1) }}"

    - name: Calculate disk usage percentage
      ansible.builtin.set_fact:
        disk_usage: "{{ (((total_size | int - initial_usage | int) / (total_size | int)) * 100) | round(0, 'floor') | int }}"

    - name: Stop execution if under threshold (Exit 0)
      when: disk_usage | int <= threshold
      ansible.builtin.meta: end_host

    # --- Cleanup Execution ---
    - name: Find files older than 3 days named core.* in /var/crash
      ansible.builtin.find:
        paths: "{{ dir }}"
        patterns: "core.*"
        age: "3d"
        file_type: file
      register: found_files

    - name: Handle case when no files are found (Exit 3)
      when: found_files.matched == 0
      block:
        - name: Log no files found
          ansible.builtin.lineinfile:
            path: "{{ logfile }}"
            create: true
            line: '{{ now_str }} Tanium-Housekeeping-PSD-Task-VAR-LOG "Disk Usage: {{ disk_usage }}", "result: NO_FILES_FOUND - No Files Found, Needs PSD Attention"'

        - name: Fail with exit code 3
          ansible.builtin.fail:
            msg: "COULD NOT FIND FILES (Exit code 3)"

    - name: Delete identified core files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ found_files.files | map(attribute='path') | list }}"
      
    - name: Append deleted files log
      ansible.builtin.blockinfile:
        path: "{{ logfile }}"
        create: true
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
        block: |
          Files Deleted {{ now_str }}
          =====================
          {% for file in found_files.files %}
          {{ file.path }}
          {% endfor %}
          ================

    # --- Post-Cleanup Verification ---
    - name: Re-gather facts to check new disk usage
      ansible.builtin.setup:
        gather_subset:
          - 'hardware'

    - name: Calculate new disk usage percentage
      ansible.builtin.set_fact:
        usage_now: "{{ (((ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var') | list | default(ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')) | first).size_total | int - (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var') | list | default(ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')) | first).size_available | int) / ((ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var') | list | default(ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')) | first).size_total | int) * 100) | round(0, 'floor') | int }}"

    - name: Log high usage remaining and exit (Exit 2)
      when: usage_now | int > threshold
      block:
        - name: Log failed housekeeping
          ansible.builtin.lineinfile:
            path: "{{ logfile }}"
            create: true
            line: '{{ now_str }} Tanium-Housekeeping-PSD-Task-VAR-LOG "Disk Usage After Housekeeping: {{ usage_now }}", "Usage Before: {{ disk_usage }}", "result: NO_SUCCESS - Needs PSD Attention"'

        - name: Fail with exit code 2
          ansible.builtin.fail:
            msg: "USAGE STILL HIGH (Exit code 2)"

    - name: Log successful housekeeping (Exit 1 logic)
      ansible.builtin.lineinfile:
        path: "{{ logfile }}"
        create: true
        line: '{{ now_str }} Tanium-Housekeeping-PSD-Task-VAR-LOG "Disk Usage After Housekeeping: {{ usage_now }}", "Usage Before: {{ disk_usage }}", "result: SUCCESS - Housekeeping Performed"'

    - name: Display success message
      ansible.builtin.debug:
        msg: "HOUSEKEEPING DONE"
