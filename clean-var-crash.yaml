---
- name: Housekeep /var filesystem
  hosts: linux-test
  become: true
  gather_facts: false

  vars:
    target_dir: /var/crash
    filesystem: /var
    threshold: 65
    file_age_days: 3
    logfile: /var/log/housekeeping-psd-task.log
    log_prefix: "Tanium-Housekeeping-PSD-Task-VAR-LOG"

  tasks:

    - name: Ensure housekeeping log file exists
      ansible.builtin.file:
        path: "{{ logfile }}"
        state: touch
        owner: root
        group: root
        mode: "0640"

    - name: Check whether target directory exists
      ansible.builtin.stat:
        path: "{{ target_dir }}"
      register: target_dir_stat

    - name: Report missing directory
      ansible.builtin.debug:
        msg: "EXIT CODE 21 - Directory {{ target_dir }} is not present"
      when: not target_dir_stat.stat.isdir | default(false)

    - name: Log missing directory
      ansible.builtin.shell: |
        printf '%s %s\n' \
          "$(date '+%b %d %T')" \
          "{{ log_prefix }} Directory {{ target_dir }} Not Present" \
          >> {{ logfile | quote }}
      when: not target_dir_stat.stat.isdir | default(false)
      changed_when: true

    - name: Set exit code for missing directory
      ansible.builtin.set_stats:
        data:
          housekeeping_exit_code: 21
          housekeeping_result: "Directory not present"
      when: not target_dir_stat.stat.isdir | default(false)

    - name: Stop when directory is missing
      ansible.builtin.meta: end_play
      when: not target_dir_stat.stat.isdir | default(false)

    - name: Check whether /var is a mount point
      ansible.builtin.command:
        argv:
          - mountpoint
          - -q
          - "{{ filesystem }}"
      register: mount_check
      changed_when: false
      failed_when: false

    - name: Report filesystem not mounted
      ansible.builtin.debug:
        msg: "EXIT CODE 22 - {{ filesystem }} is not a mount point"
      when: mount_check.rc != 0

    - name: Log filesystem not mounted
      ansible.builtin.shell: |
        printf '%s %s\n' \
          "$(date '+%b %d %T')" \
          "{{ log_prefix }} Mount Point {{ filesystem }} Not Present" \
          >> {{ logfile | quote }}
      when: mount_check.rc != 0
      changed_when: true

    - name: Set exit code for filesystem not mounted
      ansible.builtin.set_stats:
        data:
          housekeeping_exit_code: 22
          housekeeping_result: "Filesystem not mounted"
      when: mount_check.rc != 0

    - name: Stop when filesystem is not mounted
      ansible.builtin.meta: end_play
      when: mount_check.rc != 0

    - name: Check filesystem utilization before housekeeping
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ filesystem }}"
      register: df_before
      changed_when: false

    - name: Calculate filesystem utilization before housekeeping
      ansible.builtin.set_fact:
        usage_before: "{{ df_before.stdout_lines[-1].split()[-2] | regex_replace('%', '') | int }}"

    - name: Report current utilization
      ansible.builtin.debug:
        msg: "Current {{ filesystem }} utilization: {{ usage_before }}% (threshold: {{ threshold }}%)"

    - name: Log housekeeping not required
      ansible.builtin.shell: |
        printf '%s %s\n' \
          "$(date '+%b %d %T')" \
          "{{ log_prefix }} Disk Usage: {{ usage_before }}%, result: Housekeeping Not Required" \
          >> {{ logfile | quote }}
      when: usage_before <= threshold
      changed_when: true

    - name: Set exit code when utilization is below threshold
      ansible.builtin.set_stats:
        data:
          housekeeping_exit_code: 0
          housekeeping_result: "Housekeeping not required"
          usage_before: "{{ usage_before }}"
      when: usage_before <= threshold

    - name: Stop when housekeeping is not required
      ansible.builtin.meta: end_play
      when: usage_before <= threshold

    - name: Find eligible core dump files older than 3 days
      ansible.builtin.find:
        paths: "{{ target_dir }}"
        patterns:
          - "core.*"
        use_regex: false
        file_type: file
        age: 3d
        age_stamp: mtime
        recurse: false
      register: eligible_files

    - name: Report eligible files
      ansible.builtin.debug:
        msg: >-
          Found {{ eligible_files.matched }} eligible file(s)
          under {{ target_dir }}.

    - name: Delete eligible core dump files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ eligible_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: deletion_results
      when: eligible_files.matched | int > 0

    - name: Build deleted file list
      ansible.builtin.set_fact:
        deleted_files: >-
          {{
            deletion_results.results | default([])
            | selectattr('changed', 'defined')
            | selectattr('changed', 'equalto', true)
            | map(attribute='item.path')
            | list
          }}

    - name: Log deleted files
      ansible.builtin.shell: |
        {
          printf '%s %s\n' \
            "$(date '+%b %d %T')" \
            "{{ log_prefix }} Files Deleted"
          {% for file in deleted_files %}
          printf '%s\n' {{ file | quote }}
          {% endfor %}
          printf '%s\n' "====================="
        } >> {{ logfile | quote }}
      when: deleted_files | length > 0
      changed_when: true

    - name: Report when no eligible files were found
      ansible.builtin.debug:
        msg: "EXIT CODE 3 - No files found matching the housekeeping criteria"
      when: eligible_files.matched | int == 0

    - name: Log when no eligible files were found
      ansible.builtin.shell: |
        printf '%s %s\n' \
          "$(date '+%b %d %T')" \
          "{{ log_prefix }} Disk Usage: {{ usage_before }}%, result: NO_FILES_FOUND - Needs PSD Attention" \
          >> {{ logfile | quote }}
      when: eligible_files.matched | int == 0
      changed_when: true

    - name: Set exit code when no eligible files were found
      ansible.builtin.set_stats:
        data:
          housekeeping_exit_code: 3
          housekeeping_result: "No files found with criteria"
          usage_before: "{{ usage_before }}"
      when: eligible_files.matched | int == 0

    - name: Stop when no eligible files were found
      ansible.builtin.meta: end_play
      when: eligible_files.matched | int == 0

    - name: Check filesystem utilization after housekeeping
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ filesystem }}"
      register: df_after
      changed_when: false

    - name: Calculate filesystem utilization after housekeeping
      ansible.builtin.set_fact:
        usage_after: "{{ df_after.stdout_lines[-1].split()[-2] | regex_replace('%', '') | int }}"

    - name: Report final utilization
      ansible.builtin.debug:
        msg:
          - "Utilization before housekeeping: {{ usage_before }}%"
          - "Utilization after housekeeping: {{ usage_after }}%"
          - "Threshold: {{ threshold }}%"

    - name: Log unsuccessful housekeeping
      ansible.builtin.shell: |
        printf '%s %s\n' \
          "$(date '+%b %d %T')" \
          "{{ log_prefix }} Disk Usage After Housekeeping: {{ usage_after }}%, Usage Before: {{ usage_before }}%, result: NO_SUCCESS - Needs PSD Attention" \
          >> {{ logfile | quote }}
      when: usage_after > threshold
      changed_when: true

    - name: Set exit code when utilization remains high
      ansible.builtin.set_stats:
        data:
          housekeeping_exit_code: 2
          housekeeping_result: "Still same after housekeeping"
          usage_before: "{{ usage_before }}"
          usage_after: "{{ usage_after }}"
          files_deleted: "{{ deleted_files | length }}"
      when: usage_after > threshold

    - name: Log successful housekeeping
      ansible.builtin.shell: |
        printf '%s %s\n' \
          "$(date '+%b %d %T')" \
          "{{ log_prefix }} Disk Usage After Housekeeping: {{ usage_after }}%, Usage Before: {{ usage_before }}%, result: SUCCESS - Housekeeping Performed" \
          >> {{ logfile | quote }}
      when: usage_after <= threshold
      changed_when: true

    - name: Set exit code when housekeeping succeeds
      ansible.builtin.set_stats:
        data:
          housekeeping_exit_code: 1
          housekeeping_result: "Housekeeping performed"
          usage_before: "{{ usage_before }}"
          usage_after: "{{ usage_after }}"
          files_deleted: "{{ deleted_files | length }}"
      when: usage_after <= threshold

    - name: Display final housekeeping result
      ansible.builtin.debug:
        msg:
          exit_code: "{{ 2 if usage_after > threshold else 1 }}"
          result: "{{ 'Still same after housekeeping' if usage_after > threshold else 'Housekeeping performed' }}"
          usage_before: "{{ usage_before }}"
          usage_after: "{{ usage_after }}"
          files_deleted: "{{ deleted_files | length }}"
