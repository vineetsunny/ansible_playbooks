---
- name: Housekeep /var filesystem by removing old core dump files
  hosts: linux-test
  become: true
  gather_facts: true

  vars:
    target_dir: /var/crash
    target_mount: /var
    usage_threshold: 65
    file_pattern: "core.*"
    file_age: 3d
    log_file: /var/log/housekeeping-psd-task.log
    task_name: "CORE_DUMP_HOUSEKEEPING"
    housekeeping_delete: true

  tasks:
    - name: Initialize housekeeping state
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: "Initial state"
        deleted_files: []

    - name: Validate target directory
      ansible.builtin.stat:
        path: "{{ target_dir }}"
      register: dir_stat

    - name: Set failure state if directory missing
      ansible.builtin.set_fact:
        housekeeping_exit_code: 21
        housekeeping_result: "Directory {{ target_dir }} is missing or not a directory"
      when: not dir_stat.stat.exists or not dir_stat.stat.isdir

    - name: Check filesystem mount
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - TARGET
          - --target
          - "{{ target_dir }}"
      register: mount_check
      changed_when: false
      failed_when: false
      when: housekeeping_exit_code == 0

    - name: Set failure state if mount invalid
      ansible.builtin.set_fact:
        housekeeping_exit_code: 22
        housekeeping_result: "Target {{ target_dir }} is not on expected mount {{ target_mount }}"
      when:
        - housekeeping_exit_code == 0
        - mount_check.rc != 0 or (mount_check.stdout | trim) != target_mount

    - name: Read pre-cleanup filesystem utilization
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ target_dir }}"
      register: df_before
      changed_when: false
      when: housekeeping_exit_code == 0

    - name: Parse pre-cleanup utilization
      ansible.builtin.set_fact:
        usage_before: "{{ df_before.stdout_lines[-1].split()[-2] | regex_replace('%', '') | int }}"
      when: housekeeping_exit_code == 0

    - name: Report housekeeping not required
      ansible.builtin.set_fact:
        housekeeping_result: "Housekeeping not required. Utilization ({{ usage_before }}%) <= Threshold ({{ usage_threshold }}%)"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int <= usage_threshold | int

    - name: Identify eligible core dump files
      ansible.builtin.find:
        paths: "{{ target_dir }}"
        patterns:
          - "{{ file_pattern }}"
        file_type: file
        recurse: false
        age: "{{ file_age }}"
        age_stamp: mtime
        hidden: true
      register: eligible_files
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int

    - name: Report no eligible files found
      ansible.builtin.set_fact:
        housekeeping_exit_code: 3
        housekeeping_result: "No files matching {{ file_pattern }} older than {{ file_age }} found"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | int == 0

    - name: Delete eligible files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ eligible_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: cleanup_results
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | int > 0
        - housekeeping_delete | bool

    - name: Record files successfully removed
      ansible.builtin.set_fact:
        deleted_files: >-
          {{
            cleanup_results.results | default([])
            | selectattr('changed', 'equalto', true)
            | map(attribute='item.path')
            | list
          }}
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | default(0) | int > 0

    - name: Log deleted files
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: true
        owner: root
        group: root
        mode: "0640"
        insertafter: EOF
        line: "{{ ansible_date_time.iso8601 }} {{ task_name }} | Deleted: {{ item }}"
      loop: "{{ deleted_files }}"
      when: deleted_files | length > 0

    - name: Read filesystem utilization after housekeeping
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ target_dir }}"
      register: df_after
      changed_when: false
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | default(0) | int > 0

    - name: Set post-cleanup utilization fact
      ansible.builtin.set_fact:
        usage_after: "{{ df_after.stdout_lines[-1].split()[-2] | regex_replace('%', '') | int }}"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | default(0) | int > 0

    - name: Evaluate post-cleanup result (Above threshold)
      ansible.builtin.set_fact:
        housekeeping_exit_code: 2
        housekeeping_result: "Usage remains above threshold after housekeeping"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | default(0) | int > 0
        - usage_after | defined
        - usage_after | int > usage_threshold | int

    - name: Evaluate post-cleanup result (Successful)
      ansible.builtin.set_fact:
        housekeeping_exit_code: 1
        housekeeping_result: "Housekeeping performed successfully"
      when:
        - housekeeping_exit_code == 0
        - usage_before | int > usage_threshold | int
        - eligible_files.matched | default(0) | int > 0
        - usage_after | defined
        - usage_after | int <= usage_threshold | int

    - name: Write housekeeping summary to log file
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: true
        owner: root
        group: root
        mode: "0640"
        insertafter: EOF
        line: >-
          {{ ansible_date_time.iso8601 }} {{ task_name }} |
          Usage before={{ usage_before | default('N/A') }}% |
          Usage after={{ usage_after | default('N/A') }}% |
          Deleted files={{ deleted_files | length }} |
          Exit code={{ housekeeping_exit_code }} |
          Result={{ housekeeping_result }}
      when: usage_before is defined

    - name: Display housekeeping summary
      ansible.builtin.debug:
        msg:
          - "Target filesystem: {{ target_dir }}"
          - "Usage before: {{ usage_before | default('N/A') }}%"
          - "Usage after: {{ usage_after | default('N/A') }}%"
          - "Files deleted: {{ deleted_files | length }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"

    - name: Return housekeeping exit code status
      ansible.builtin.fail:
        msg: "{{ housekeeping_result }} (exit code {{ housekeeping_exit_code }})"
      when: housekeeping_exit_code not in [0, 1]
