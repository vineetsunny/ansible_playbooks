# =============================================================================
# Playbook Name : clean-var-crash.yml
# Description   : Performs automated housekeeping of the /var filesystem on
#                 Linux systems when filesystem utilization reaches 65%.
#
# Purpose       : Helps prevent filesystem capacity issues by deleting
#                 eligible core dump files under /var/crash that are older
#                 than 3 days.
#
# Scope         : Linux servers
# Target FS     : /var
# Target Dir    : /var/crash
# Threshold     : 65% filesystem utilization
# File Pattern  : core.*
# File Age      : Older than 3 days
# Action        : Delete eligible core dump files
# Log File      : /var/log/housekeeping-psd-task.log
#
# Prerequisites:
#   - Ansible connectivity to the target Linux server.
#   - Privilege escalation (become: true).
#   - Target filesystem mounted and accessible.
#   - Target directory /var/crash exists and is accessible.
#   - Appropriate permissions to identify and delete eligible files.
#
# Execution     : ansible-playbook -i inventory clean-var-crash.yml
#
# Exit Codes:
#   0  - Housekeeping not required; utilization is below the threshold.
#   1  - Housekeeping performed.
#   2  - Filesystem utilization remains unchanged after housekeeping.
#   3  - No eligible files found for housekeeping.
#   21 - Target directory not present.
#   22 - Target filesystem not mounted.
#   23 - Region not supported.
#
# Logging:
#   - Log file on the target server: /var/log/housekeeping-psd-task.log
#
# Important     : Only files matching the core.* pattern and older than
#                 3 days are eligible for deletion. Core dump files may
#                 contain useful diagnostic information. Validate the
#                 cleanup criteria and retention requirements before
#                 production execution.
#
# Version       : 1.0
# =============================================================================
---
- name: Housekeeping of /var filesystem on Linux systems
  hosts: 
  become: true
  gather_facts: true

  vars:
    filesystem: "/var"
    target_dir: "/var/crash"
    usage_threshold: 65
    file_age_days: 3
    log_file: "/var/log/housekeeping-psd-task.log"
    task_name: "Tanium-Housekeeping-PSD-Task-VAR"

  tasks:
    - name: Initialize housekeeping result
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: "Housekeeping not started"
        usage_before: 0
        usage_after: 0
        deleted_files: []

    - name: Check whether target directory exists
      ansible.builtin.stat:
        path: "{{ target_dir }}"
      register: target_dir_stat

    - name: Report missing target directory
      ansible.builtin.set_fact:
        housekeeping_exit_code: 21
        housekeeping_result: "Directory not present: {{ target_dir }}"
      when: >
        not target_dir_stat.stat.exists
        or not target_dir_stat.stat.isdir

    - name: Check whether target filesystem is mounted
      ansible.builtin.command:
        argv:
          - findmnt
          - --mountpoint
          - "{{ filesystem }}"
      register: mount_check
      changed_when: false
      failed_when: false
      when: (housekeeping_exit_code | int) == 0

    - name: Report target filesystem is not mounted
      ansible.builtin.set_fact:
        housekeeping_exit_code: 22
        housekeeping_result: "Filesystem not mounted at {{ filesystem }}"
      when:
        - (housekeeping_exit_code | int) == 0
        - mount_check.rc != 0

    - name: Get filesystem usage before housekeeping
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ filesystem }}"
      register: df_before
      changed_when: false
      when: (housekeeping_exit_code | int) == 0

    - name: Set initial filesystem usage
      ansible.builtin.set_fact:
        usage_before: >-
          {{
            df_before.stdout_lines[-1].split()[-2]
            | regex_replace('%', '')
            | int
          }}
        usage_after: >-
          {{
            df_before.stdout_lines[-1].split()[-2]
            | regex_replace('%', '')
            | int
          }}
      when: (housekeeping_exit_code | int) == 0

    - name: Stop housekeeping when usage is within threshold
      ansible.builtin.set_fact:
        housekeeping_exit_code: 0
        housekeeping_result: >-
          Housekeeping not required; usage is {{ usage_before }}%
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) <= (usage_threshold | int)

    - name: Find eligible core dump files
      ansible.builtin.find:
        paths: "{{ target_dir }}"
        patterns:
          - "core.*"
        use_regex: false
        file_type: file
        age: "{{ file_age_days }}d"
        age_stamp: mtime
        recurse: false
      register: eligible_files
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)

    - name: Report no eligible files found
      ansible.builtin.set_fact:
        housekeeping_exit_code: 3
        housekeeping_result: >-
          No eligible core dump files found; PSD attention required
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | int) == 0

    - name: Delete eligible core dump files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ eligible_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: cleanup_results
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | int) > 0

    - name: Record files successfully removed
      ansible.builtin.set_fact:
        deleted_files: >-
          {{
            cleanup_results.results | default([])
            | selectattr('changed', 'defined')
            | selectattr('changed', 'equalto', true)
            | map(attribute='item.path')
            | list
          }}
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | int) > 0

    - name: Log deleted files
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: true
        mode: "0640"
        insertafter: EOF
        line: >-
          {{ ansible_date_time.iso8601 }} {{ task_name }}
          | Deleted: {{ item }}
      loop: "{{ deleted_files }}"
      when: deleted_files | length > 0

    - name: Wait 30 seconds for filesystem usage to stabilize
      ansible.builtin.pause:
        seconds: 30
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | default(0) | int) > 0
        - deleted_files | length > 0

    # Run df again after deletion to obtain the current usage.
    - name: Get fresh filesystem usage after housekeeping
      ansible.builtin.command:
        argv:
          - df
          - -P
          - "{{ filesystem }}"
      register: df_after
      changed_when: false
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | default(0) | int) > 0

    - name: Set final filesystem usage
      ansible.builtin.set_fact:
        usage_after: >-
          {{
            df_after.stdout_lines[-1].split()[-2]
            | regex_replace('%', '')
            | int
          }}
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | default(0) | int) > 0

    - name: Report unsuccessful housekeeping
      ansible.builtin.set_fact:
        housekeeping_exit_code: 2
        housekeeping_result: >-
          Usage remains above threshold after housekeeping
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | default(0) | int) > 0
        - (usage_after | int) > (usage_threshold | int)

    - name: Report successful housekeeping
      ansible.builtin.set_fact:
        housekeeping_exit_code: 1
        housekeeping_result: >-
          Housekeeping performed successfully
      when:
        - (housekeeping_exit_code | int) == 0
        - (usage_before | int) > (usage_threshold | int)
        - (eligible_files.matched | default(0) | int) > 0
        - (usage_after | int) <= (usage_threshold | int)

    - name: Write housekeeping summary to log
      ansible.builtin.lineinfile:
        path: "{{ log_file }}"
        create: true
        mode: "0640"
        insertafter: EOF
        line: >-
          {{ ansible_date_time.iso8601 }} {{ task_name }} |
          Usage before={{ usage_before }}% |
          Usage after={{ usage_after }}% |
          Deleted files={{ deleted_files | length }} |
          Exit code={{ housekeeping_exit_code }} |
          Result={{ housekeeping_result }}

    - name: Display housekeeping summary
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ filesystem }}"
          - "Cleanup directory: {{ target_dir }}"
          - "Usage before: {{ usage_before }}%"
          - "Usage after: {{ usage_after }}%"
          - "Threshold: {{ usage_threshold }}%"
          - "Files deleted: {{ deleted_files | length }}"
          - "Deleted files: {{ deleted_files }}"
          - "Raw df output before: {{ df_before.stdout | default('Not checked') }}"
          - "Raw df output after: {{ df_after.stdout | default('Not rechecked') }}"
          - "Result: {{ housekeeping_result }}"
          - "Exit code: {{ housekeeping_exit_code }}"

    - name: Return housekeeping failure status
      ansible.builtin.fail:
        msg: >-
          {{ housekeeping_result }}
          (logical exit code {{ housekeeping_exit_code }})
      when: (housekeeping_exit_code | int) not in [0, 1]
